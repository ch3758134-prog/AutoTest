name: Project Control V2

on:
  push:
    branches:
      - management/project-control-redesign-20261111
    paths:
      - 'tools/project-control-v2/**'
      - '.github/workflows/project-control-v2.yml'
  pull_request:
    paths:
      - 'tools/project-control-v2/**'
      - '.github/workflows/project-control-v2.yml'
  workflow_dispatch:

jobs:
  project-control-validation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile isolated project management service
        run: python -m compileall -q tools/project-control-v2
      - name: Check browser scripts
        run: |
          node --check tools/project-control-v2/app.js
          node --check tools/project-control-v2/actions.js
      - name: Check portable manager browser script
        run: node --check tools/project-control-v2/portable/web/app.js
      - name: Verify portable project UI behavior
        run: node tools/project-control-v2/tests/portable_ui_behavior.js
      - name: Verify interactive project-management semantics
        run: node tools/project-control-v2/tests/ui_behavior.js
      - name: Run domain, authorization and real-project tests
        run: python -m unittest discover -s tools/project-control-v2/tests -v
      - name: Export verified generic management package
        run: python tools/project-control-v2/portable/export_package.py --out ProjectControl_Portable.zip
      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: ProjectControl-Portable-Candidate
          path: ProjectControl_Portable.zip
          if-no-files-found: error
          retention-days: 30
