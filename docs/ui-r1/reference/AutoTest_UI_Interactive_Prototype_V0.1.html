function inspectorStep(st){return `<div class="panel-title">STEP PROPERTIES <span class="push"></span><button data-action="toggle-inspector">×</button></div><div class="inspector-head"><div class="kind">${E(st.type)} · ${E(st.id)} ${s.breakpoints.includes(st.id)?'● BREAKPOINT':''}</div><h3>${E(st.name.trim())}</h3><span class="chip">${E(st.scope)}</span> ${badge(s.source)}</div><div class="inspector-section"><div class="heading">参数 / Parameters</div><div class="field"><label>步骤名称</label><input data-change="step-name" value="${E(st.name)}"></div><div class="field"><label>资源来源（SignalRef / 控制器）</label><select data-change="step-source">${option(['station.preflight','ParkingSwitch.Neutral','ParkingSwitch.Apply','ParkingSwitch.Release','EPB_Status','MotorCurrent','BatteryVoltage','DUT_CAN/0x321','CurrentReference','RecordStore','Counter'],st.source)}</select></div><div class="field"><label>期望 / Expected</label><input data-change="step-expected" value="${E(st.expected)}"></div><div class="field"><label>超时（ms）</label><input type="number" min="10" max="60000" data-change="step-timeout" value="${Number(st.timeout)||1000}"></div></div><div class="inspector-section"><div class="heading">预期和实际分离</div><div class="kv"><span>预期</span><span>${E(st.expected)}</span></div><div class="kv"><span>实际</span><span>${E(s.debugResults[st.id]||'未执行')}</span></div><div class="kv"><span>结果</span><span>${E(s.debugResults[st.id]?'MOCK · '+s.debugResults[st.id]:'N/A')}</span></div></div><div class="inspector-section"><div class="heading">步骤操作</div><div class="row wrap">${btn('切换断点','breakpoint',st.id,'subtle')}${btn('运行到此','run-to',st.id,'subtle')}${btn('跳过/恢复','skip-step',st.id,'subtle')}${btn('定位引用','step-ref',st.id)}</div><p class="hint">更改属性后内存标记为未保存；运行只使用当前原型中的演示快照。</p></div>`}
function inspectorSignal(sig){return `<div class="panel-title">SIGNAL INSPECTOR <span class="push"></span><button data-action="toggle-inspector">×</button></div><div class="inspector-head"><div class="kind">DBC SIGNAL · EPB_Application.dbc</div><h3>${E(sig.name)}</h3>${badge(s.source)} <span class="chip">DBC rev ${s.dbcRev}</span></div><div class="inspector-section"><div class="heading">编码定义</div><div class="field"><label>名称</label><input data-change="dbc-name" value="${E(sig.name)}"></div><div class="field"><label>起始位 / Start bit</label><input type="number" min="0" max="63" data-change="dbc-start" value="${sig.start}"></div><div class="field"><label>长度 / Length</label><input type="number" min="1" max="64" data-change="dbc-len" value="${sig.len}"></div><div class="field"><label>比例因子 / Factor</label><input type="number" step="0.01" data-change="dbc-scale" value="${sig.scale}"></div><div class="field"><label>单位 / Unit</label><input data-change="dbc-unit" value="${E(sig.unit)}"></div></div><div class="inspector-section"><div class="heading">实时解码（示例）</div><div class="metric-block">${Number(sig.value).toFixed(2)} <span class="small muted">${E(sig.unit)}</span></div><div class="kv"><span>帧</span><span>${sig.msg}</span></div><div class="kv"><span>质量</span><span>${s.source==='Physical'?'NO_OBSERVATION':s.source.toUpperCase()}</span></div><div class="row wrap">${btn('加入波形','signal-wave',sig.name)}${btn('插入断言','signal-assert',sig.name)}</div></div>`}
function inspectorController(){let c=s.controllers.find(x=>x.id===s.selectedController)||s.controllers[0];let st=c.states.find(x=>x.id===s.selectedControlState)||c.states[0];return `<div class="panel-title">CONTROLLER EDITOR <span class="push"></span><button data-action="toggle-inspector">×</button></div><div class="inspector-head"><div class="kind">CONFIG / STATE MAPPING</div><h3>${E(c.name)} / ${E(st.name)}</h3><span class="chip">rev ${c.revision}</span> ${s.controllerDraft?badge('DRAFT'):''}</div><div class="inspector-section"><div class="heading">用户定义</div><div class="field"><label>状态名称</label><input data-change="state-name" value="${E(st.name)}"></div><div class="field"><label>状态 ID</label><input value="${E(st.id)}" disabled></div><div class="field"><label>操作策略</label><select data-change="state-mode">${option(['momentary','latching','return'],st.mode)}</select></div><div class="kv"><span>硬件映射</span><span class="mono">0x${st.mask.toString(16).toUpperCase().padStart(5,'0')}</span></div></div><div class="inspector-section"><div class="heading">引用关系</div><p class="hint">测试节点使用 controllerId + stateId + revision；保存新修订后旧节点必须重新验证。</p>${btn('查看引用','references')}</div>`}
function renderProject(){return heading('工程中心','EPB 是当前示例 ECU；工程资源模型不依赖 EPB 专用界面。',btn('查看依赖引用','references')+btn('验证工程','validate','', 'accent'),'PROJECT WORKSPACE')+`<div class="info-banner">◆ 当前 Project：<b>EPB_DUT_A</b> / rev 12，资源、文档和测试绑定都有版本身份。本文中的示例资源均不表示真实设备已接入。</div><div class="stats"><div class="stat"><div class="value">12</div><div class="subtitle">工程 Revision</div></div><div class="stat"><div class="value">${s.steps.length}</div><div class="subtitle">程序节点</div></div><div class="stat"><div class="value">${s.dbcSignals.length}</div><div class="subtitle">DBC Signals</div></div><div class="stat"><div class="value">${s.controllers.length}</div><div class="subtitle">控制器定义</div></div></div>`+card('工程资源与操作入口',table(['类型','资源','版本','上下游引用','操作'],[['站点配置','StationProfile_R1','rev 4','CAN / Control / UDS','station'],['DBC','EPB_Application.dbc','rev '+s.dbcRev,'4 Signals / 7 Steps','dbc'],['测试','EPB_EOL_Integration','v1.3','Program + Resources','program'],['控制器','SwitchProfile','rev 3','Bench / Program','controller'],['波形','CurrentReference.wave','rev 2','WaveAssert / Run','wave'],['镜像','EPB_FW_1.7.2.hex','SHA256: DEMO','ProgrammingProfile','flash'],['规则','IdentityRules','rev 2','Scan / Production','production']].map(([kind,name,rev,ref,id])=>`<tr data-action="tab" data-id="${id}"><td>${kind}</td><td class="accent-text">${name}</td><td class="mono">${rev}</td><td class="muted">${ref}</td><td>${btn('打开','tab',id)}</td></tr>`).join('')))+card('跨工具协作 | 使用资源而非复制配置',`<div class="grid3"><div><div class="eyebrow">01 · 工程定义</div><div class="message-text">DBC SignalRef、Controller Revision、Station endpoint、Wave Reference 和 Flash Profile 各有唯一来源。</div></div><div><div class="eyebrow">02 · 验证与快照</div><div class="message-text">测试准备阶段固定定义及 Hash；修改 DBC 或控制器时提示受影响步骤，避免静默改义。</div></div><div><div class="eyebrow">03 · 运行事实</div><div class="message-text">Command / Acknowledgement / Observation / Verdict 采用不同证据类型，关联 RunId、DUT 与来源。</div></div></div>`);
}
function renderStation(){let state=s.connected?'Connected':'Disconnected';let physical=s.source==='Physical';return heading('设备与 Station','显式枚举、连接、断开；双 CAN 角色不等于实体端口丝印。',btn('发现设备','discover')+btn(s.connected?'断开连接':'连接 Station','connect','',s.connected?'warn':'accent'),'DEVICE / CONNECTION')+`<div class="info-banner ${physical?'warn':''}">${physical?'⚠ Physical 视图仅供界面审阅：没有 WinUSB 后端，所有连接与物理操作都不执行。':'◈ 当前设备为 '+s.source+' 仿真接口。操作反馈只表示模拟的 Session 行为。'}</div><div class="stats"><div class="stat"><div class="value ${s.connected?'green-text':'yellow-text'}">${state}</div><div class="subtitle">USB Session</div></div><div class="stat"><div class="value">${s.connected?'1':'0'}</div><div class="subtitle">可用 Station</div></div><div class="stat"><div class="value">2</div><div class="subtitle">CAN Roles（示例）</div></div><div class="stat"><div class="value">${physical?'LOCKED':'Mock'}</div><div class="subtitle">物理输出权限</div></div></div><div class="grid2">`+card('设备身份',`<div class="form-grid"><label>会话目标</label><select><option>MAIN_CTRL / DEMO-USB-001</option></select><label>连接世代</label><span class="mono">${s.connected?'GEN-0004':'—'}</span><label>驱动类型</label><span>WinUSB 适配器 · ${s.source==='Physical'?'未连接':'模拟'}</span><label>USB 版本</label><span>${s.connected?'v1.2 (DEMO)':'未知'}</span><label>最近心跳</label><span>${s.connected?dt()+' / Mock ACK':'无'}</span><label>连接限制</label><span class="yellow-text">禁止扫码枪误识别；精确 VID/PID/身份</span></div><div class="spacer"></div>${btn('PING / Version','ping')} ${btn('读取状态','read-state')} ${btn('查看底层日志','bottom','log')}`)+card('设备角色 / Endpoint',table(['资源','角色','实际映射','状态'],[['USB', '主控设备', 'WinUSB', s.connected?'MOCK ONLINE':'OFFLINE'],['CAN 0', 'Keypad CAN', '0x730 / 单独的按键板',s.connected?'模拟就绪':'不可用'],['CAN 1', 'DUT CAN', '500 kbit/s · 示例',s.connected?'模拟就绪':'不可用'],['IGN', '受控输出', 'SET_IGN = 0x12', 'Physical 锁定'],['夹具', '电磁阀', '无到位传感器', 'Physical 锁定']].map(v=>`<tr>${v.map(q=>`<td>${q}</td>`).join('')}</tr>`).join('')))+`</div>`+card('共享资源租约',`<div class="grid3"><div><div class="eyebrow">CAN Receive Hub</div><span class="chip ${s.monitoring?'good':'gray'}">${s.monitoring?'Mock 订阅中':'未订阅'}</span><p class="hint">多个工具订阅同一 CAN Hub，不各自创建独立 USB Session。</p></div><div><div class="eyebrow">CAN Transmit Lease</div><span class="chip">${s.debugState==='running'?'Run / 独占':'Available'}</span><p class="hint">发送冲突时返回明确资源占用原因。</p></div><div><div class="eyebrow">未来 DUT B</div><span class="chip gray">尚未启用</span><p class="hint">双工位将独立持有 RunContext 和 Station Binding，共享资源需仲裁。</p></div></div>`)}
function traceFrame(){s.frameSeq++;const id=s.frameSeq%3===0?'322':s.frameSeq%5===0?'730':'321';const data=id==='321'?`${(s.frameSeq%3).toString(16).padStart(2,'0')} ${Math.floor(16+Math.random()*14).toString(16)} 03 41 05 00 00 00`:id==='322'?`0${s.frameSeq%2} 00 00 00 00 00 00 00`:'01 20 01 00 00 00 00 00';let f={seq:s.frameSeq,time:dt()+'.'+String((performance.now()%1000)|0).padStart(3,'0'),id,port:id==='730'?'KEYPAD_CAN':'DUT_CAN',dir:'RX',dlc:8,data:data.toUpperCase(),quality:s.source==='Physical'?'HostArrivalOnly':s.source==='Replay'?'ReplayTimestamp':'Synthesized'};s.frames.unshift(f);s.frames=s.frames.slice(0,110);s.dbcSignals[0].value=Number.parseInt(data.slice(0,2),16)%3;s.dbcSignals[1].value=+(7+Math.sin(s.frameSeq/5)*1.8).toFixed(2);s.dbcSignals[2].value=+(12.3+Math.sin(s.frameSeq/10)*.1).toFixed(2);s.waveCycle++;
if(s.active==='can'||s.active==='dbc'||s.active==='wave'||s.bottom==='can')render();}
function addTxFrame(id=s.canId,data=s.canData){if(s.source==='Physical'){blocked('CAN 发送');return}if(s.source==='Replay'){toast('Replay 是只读数据源，禁止注入新的发送帧。','warn');return}if(!s.connected){toast('请先在 Station 工具中连接 Mock Session。','warn');return}if(s.debugState==='running'){toast('发送被拒绝：测试运行占用 CAN Transmit Lease。','warn');return}let norm=id.toString().replace(/^0x/i,'');if(!/^[0-9a-f]{1,8}$/i.test(norm)){toast('CAN ID 非法：请输入十六进制 0x000–0x7FF 或扩展帧 ID。','error');return}let bytes=data.trim().split(/\s+/);if(bytes.length>8||bytes.some(v=>!/^[a-f0-9]{2}$/i.test(v))){toast('DATA 应为 0–8 个空格分隔的十六进制字节。','error');return}s.frameSeq++;s.frames.unshift({seq:s.frameSeq,time:dt(),id:norm.toUpperCase(),port:'DUT_CAN',dir:'TX',dlc:bytes.length,data:bytes.join(' ').toUpperCase(),quality:'MockTx'});s.frames=s.frames.slice(0,110);toast(`MOCK CAN TX 接受 · ID 0x${norm.toUpperCase()}，不代表真实总线发送。`);render()}
function startTrace(){if(s.source==='Physical'){blocked('物理 CAN 接收');return}if(!s.connected){toast('请先连接 Mock/Replay Station。','warn');return}s.monitoring=true;clearInterval(traceTimer);traceTimer=setInterval(()=>{if(!s.tracePause)traceFrame()},700);toast(s.source==='Replay'?'已开始演示 Replay 帧流。':'已开启 Mock CAN 接收。');render();}
function stopTrace(notify=true){clearInterval(traceTimer);traceTimer=null;clearInterval(cycleTimer);cycleTimer=null;s.monitoring=false;s.txPeriod=false;if(notify)toast('CAN 监视已停止。')}
function renderCan(){let frames=s.frames.filter(f=>(s.canDir==='ALL'||f.dir===s.canDir)&&(!s.canFilter||('0x'+f.id+' '+f.data+' '+f.port).toLowerCase().includes(s.canFilter.toLowerCase())));return heading('CAN Monitor','多端点接收、原始帧/解码联动、过滤与独立发送；仅 Mock 可模拟 TX。',btn(s.monitoring?'停止监视':'▶ 开始监视',s.monitoring?'stop-monitor':'start-monitor','',s.monitoring?'warn':'accent')+btn('清空可见缓存','clear-frames'),'COMMUNICATION / CAN')+`<div class="row wrap" style="margin-bottom:13px">${badge(s.source)}<span class="chip">DUT_CAN · 500 kbit/s (demo)</span><span class="chip ${s.monitoring?'good':''}">${s.monitoring?'● 正在接收':'○ 停止接收'}</span><span class="chip">${s.frames.length} 帧缓存</span><span class="chip">时间质量 ${s.source==='Physical'?'HostArrivalOnly':s.source==='Mock'?'Synthesized':'ReplayTimestamp'}</span><span class="push"></span>${btn(s.tracePause?'继续显示':'冻结显示', 'pause-trace')}</div>`+card('报文监视 | Trace',`<div class="subtoolbar"><input style="width:210px" placeholder="过滤 ID / DATA / 端点" data-input="can-filter" value="${E(s.canFilter)}"><select data-change="can-dir">${option(['ALL','RX','TX'],s.canDir)}</select><span class="push"></span>${btn('选中 → Signal','frame-signal')}${btn('选中 → 波形','frame-wave')}</div>${table(['时刻','通道','方向','ID','DLC','DATA','来源/质量'],frames.slice(0,70).map(f=>`<tr class="${f.seq===s.selectedFrame?'selected':''}" data-action="frame-select" data-id="${f.seq}"><td class="mono">${f.time}</td><td>${f.port}</td><td class="${f.dir==='RX'?'trace-rx':'trace-tx'}">${f.dir}</td><td class="mono">0x${f.id}</td><td>${f.dlc}</td><td class="mono">${f.data}</td><td class="muted">${f.quality}</td></tr>`).join(''))}`)+`<div class="grid2">`+card('发送编辑 / Tx Composer',`<div class="form-grid"><label>发送通道</label><select><option>DUT_CAN</option><option>KEYPAD_CAN (演示只读)</option></select><label>报文 ID (Hex)</label><input data-change="can-id" value="${E(s.canId)}" class="mono"><label>字节 DATA</label><input data-change="can-data" value="${E(s.canData)}" class="mono"><label>周期（ms）</label><input type="number" data-change="can-period" value="${s.canPeriodMs}" min="20" max="10000"></div><div class="spacer"></div><div class="row wrap">${btn('发送一次','can-send','',s.source==='Mock'?'accent':'warn')}${btn(s.txPeriod?'停止周期':'启动周期',s.txPeriod?'stop-cycle':'start-cycle')}<span class="hint">Physical 无实际发送能力</span></div>`)+card('信号解码 / DBC link',table(['Signal','最新值','单位','质量','操作'],s.dbcSignals.map(x=>`<tr><td class="accent-text" data-action="signal-open" data-id="${x.name}">${x.name}</td><td class="mono">${s.frames.length?x.value:'—'}</td><td>${x.unit}</td><td>${s.frames.length?badge(s.source):'未观测'}</td><td>${btn('波形 ↗','signal-wave',x.name)}</td></tr>`).join('')))+`</div>`;}
function renderDbc(){let byMsg=s.dbcSignals.filter(x=>x.msg===s.selectedMessage);let selected=s.dbcSignals.find(x=>x.name===s.selectedSignal)||s.dbcSignals[0];let bits=Array.from({length:64},(_,i)=>{let matches=byMsg.filter(sig=>i>=sig.start&&i<sig.start+sig.len);return `<div class="bit-cell ${matches.length>1?'conflict':matches.length?'on':''}" title="Byte ${i>>3}, bit ${i%8} · ${matches.map(x=>x.name).join(',')||'空闲'}">${(i>>3)+1}.${i%8}</div>`}).join('');return heading('DBC Editor','可编辑信号定义、Bit Layout、引用导航、实时解码；修改需校验并升级 Revision。',btn('保存 DBC Revision','dbc-save','',s.dbcDirty?'accent':'subtle')+btn('查看引用','references'),'DATA / DBC')+`<div class="row wrap" style="margin-bottom:12px"><span class="chip">EPB_Application.dbc</span><span class="chip">rev ${s.dbcRev}</span>${s.dbcDirty?'<span class="chip dirty">● 有未保存修改</span>':'<span class="chip good">✓ 已保存</span>'}${badge(s.source)}<span class="push"></span>${btn('加入信号','dbc-add')}${btn('校验布局','dbc-validate')}</div><div class="grid2" style="grid-template-columns:minmax(170px,.6fr) minmax(0,1.4fr)">`+card('消息 / Message Directory',`<div class="side-mini ${s.selectedMessage==='0x321'?'accent-text':''}" data-action="message" data-id="0x321"><div class="line1"><b>0x321 · EPB_State</b><span class="chip">DLC 8</span></div><small>3 Signals / DUT_CAN</small></div><div class="side-mini ${s.selectedMessage==='0x322'?'accent-text':''}" data-action="message" data-id="0x322"><div class="line1"><b>0x322 · SwitchInput</b><span class="chip">DLC 8</span></div><small>1 Signal / DUT_CAN</small></div><div class="spacer"></div><p class="hint">原型支持在现有示例消息中编辑信号；保存是浏览器内 Revision，不会改写实际 DBC 文件。</p>`)+card(`信号 / ${s.selectedMessage}`,table(['Signal','位段','Factor','Offset','Unit','Live','操作'],byMsg.map(x=>`<tr class="${s.selectedSignal===x.name?'selected':''}" data-action="signal-select" data-id="${x.name}"><td class="accent-text">${x.name}</td><td class="mono">${x.start}:${x.len}</td><td class="mono">${x.scale}</td><td>${x.offset}</td><td>${x. function renderController(){let c=s.controllers.find(x=>x.id===s.selectedController)||s.controllers[0];let state=c.states.find(x=>x.id===s.selectedControlState)||c.states[0];let bits=Array.from({length:20},(_,i)=>`<button class="bit-button ${(state.mask&(1<<i))?'set':''}" data-action="bit" data-id="${i}" title="底层 20bit mask · bit ${i}">K${String(i+1).padStart(2,'0')}</button>`).join('');return heading('Controller Designer','工程配置层：用户定义控制器、任意数量状态、底层硬件映射和操作策略。',btn('新增控制器','controller-add')+btn('保存新 Revision','controller-save','',s.controllerDraft?'accent':'subtle'),'ENGINEERING / CONFIGURATION')+`<div class="info-banner warn">◆ 此处的 20bit 是 <b>当前示例按键板</b> 的底层 HardwareMapping，不是手动台架页面的固定 20 键；其他设备能力可以映射不同控件集合。</div><div class="grid2" style="grid-template-columns:minmax(220px,.7fr) minmax(0,1.3fr)">`+card('控制器与状态',`<select class="w100" data-change="controller-select">${s.controllers.map(x=>`<option value="${E(x.id)}" ${x.id===c.id?'selected':''}>${E(x.name)} · rev ${x.revision}</option>`).join('')}</select><div class="spacer"></div><div class="state-list">${c.states.map(x=>`<div class="state-row ${x.id===state.id?'selected':''}" data-action="controller-state" data-id="${x.id}"><span>${E(x.name)}</span><span class="mono muted">${'0x'+x.mask.toString(16).padStart(5,'0').toUpperCase()}</span></div>`).join('')}</div><div class="spacer"></div><div class="row wrap">${btn('＋ 新增状态','state-add')}${btn('复制状态','state-copy')}${btn('删除状态','state-delete','', 'danger-outline')}</div>`)+card('HardwareMapping / 20-bit mask',`<div class="row"><b>${E(state.name)}</b><span class="chip mono">0x${state.mask.toString(16).toUpperCase().padStart(5,'0')}</span><span class="push"></span><span class="hint">点击切换掩码位</span></div><div class="spacer"></div><div class="bit-buttons">${bits}</div><div class="hr"></div><div class="grid2"><div class="field"><label>行为策略</label><select data-change="state-mode">${option(['momentary','latching','return'],state.mode)}</select></div><div class="field"><label>恢复状态 function renderBench(){let actions=s.controllers.map(c=>`<div class="control-card"><div class="top"><div><div class="name">${E(c.name)}</div><div class="hint mono">${c.id} · rev ${c.revision}</div></div><span class="chip">${c.states.length} states</span></div><div class="states">${c.states.map(st=>`<button data-action="bench-state" data-id="${c.id}::${st.id}" class="${s.controllerValues[c.id]===st.id?'active':''}"><div class="row"><b>${E(st.name)}</b><span class="push"></span><span class="chip gray">${st.mode==='momentary'?'瞬态':'保持'}</span></div><div class="hint mono">state:${E(st.id)} / map:0x${st.mask.toString(16).toUpperCase().padStart(5,'0')}</div></button>`).join('')}</div><div class="bottom">当前选择：<b>${E(s.controllerValues[c.id]||'未执行')}</b><div>命令状态：${s.controllerValues[c.id]?'模拟请求已接收':'无命令'} · 电压回读：未知</div></div></div>`).join('');return heading('Manual Bench','状态按钮由工程 ControllerDefinition 动态生成；不直接暴露底层固定 20 Key。',btn('配置控制器','tab','controller')+btn('录入电压实测','measure'),'HARDWARE / MANUAL BENCH')+`<div class="row wrap" style="margin-bottom:13px">${badge(s.source)}<span class="chip ${s.connected?'good':'warning'}">${s.connected?'Station 已连接 (模拟)':'Station 未连接'}</span><span class="chip">DUT A / EPB_DUT_A</span><span class="chip">无实测 ADC</span><span class="push"></span>${btn('查看 CAN 操作','tab','can')}</div><div class="info-banner ${s.source==='Physical'?'warn':''}">◆ 控制器点击仅作用于 Mock 状态机；Physical 模式下明确拒绝输出。平台不因“已请求”就宣称“状态已达到”。夹具、IGN 等具有物理副作用的输出保持锁定。</div><div class="controllers">${actions}</div><div class="spacer"></div>`+card('操作与观测来源矩阵',table(['对象','预期配置','命令/ACK','物理观测','裁决'],s.controllers.map(c=>`<tr><td>${E(c.name)}</td><td>${E(s.controllerValues[c.id]||'未指定')}</td><td>${s.controllerValues[c.id]&&s.source==='Mock'?'Mock ACK':'无'}</td><td class="yellow-text">${s.manualFacts.length?'人工录入 '+s.manualFacts.length+' 条':'未观测'}</td><td>INCONCLUSIVE</td></tr>`).join('')))+card('五路电压测量事实 / Manual Evidence',table(['时间','控制器','状态','V1','V2','V3','V4','V5','来源'],s.manualFacts function waveformSVG(){const W=1000,H=310,LM=44,RM=17,TM=17,BM=29,iw=W-LM-RM,ih=H-TM-BM;let grid='';for(let i=0;i<=10;i++){let x=LM+iw*i/10;grid+=`<line x1="${x}" y1="${TM}" x2="${x}" y2="${H-BM}" stroke="var(--stroke-soft)"/><text x="${x}" y="${H-8}" font-size="11" text-anchor="middle" fill="var(--faint)">${+(s.waveWindow*i/10).toFixed(1)}</text>`}for(let i=0;i<=5;i++){let y=TM+ih*i/5;grid+=`<line x1="${LM}" y1="${y}" x2="${W-RM}" y2="${y}" stroke="var(--stroke-soft)"/><text x="${LM-9}" y="${y+4}" font-size="11" text-anchor="end" fill="var(--faint)">${Math.round(10-2*i)}</text>`}function point(x,v){return `${(LM+iw*x).toFixed(1)},${(TM+ih*(1-v)).toFixed(1)}`}
let curves='';for(let k=0;k<3;k++){let name=['EPB_Status','MotorCurrent','BatteryVoltage'][k];if(!s.signalPlot.includes(name))continue;let pts=[];for(let i=0;i<=180;i++){let x=i/180;let v=k===0?(.27+Math.round((Math.sin(x*13+s.waveCycle*.015)+1.2)/1.3)*.18):k===1?(.53+Math.sin(x*22+s.waveCycle*.11)*.18+Math.sin(x*62)*.025):(.78+Math.sin(x*7+s.waveCycle*.08)*.045);pts.push(point(x,v))}curves+=`<polyline points="${pts.join(' ')}" stroke="${['#51bbff','#54dbbd','#e5adff'][k]}" fill="none" stroke-width="${k===1?2.6:2}" stroke-linejoin="round"/>`}
let ref='';if(s.reference){let pts=[];for(let i=0;i<=180;i++){let x=i/180;pts.push(point(x,.53+Math.sin(x*22)*.18));}ref=`<polyline points="${pts.join(' ')}" stroke="${'#f2bd6d'}" opacity=".6" fill="none" stroke-width="1.4" stroke-dasharray="6 5"/>`}
let cx=LM+iw*s.waveCursor/s.waveWindow;return `<svg viewBox="0 0 ${W} ${H}" class="diagram" id="waveDiagram" data-wave="yes" role="img" aria-label="仿真波形图（可单击改变游标）">${grid}<text x="${LM+4}" y="${TM+14}" font-size="11" fill="var(--faint)">归一化视图 · 真实物理值请查看下方信号表</text>${ref}${curves}<line x1="${cx}" y1="${TM}" x2="${cx}" y2="${H-BM}" stroke="#f3c985" stroke-width="1.4" stroke-dasharray="4 3"/><rect x="${Math.min(cx+4,W-80)}" y="${TM+2}" width="68" height="21" rx="4" fill="var(--raised)"/><text x="${Math.min(cx+10,W-74)}" y="${TM+17}" font-size="11" fill="var(--text)">A ${s.waveCursor.toFixed(2)}s</text></svg>`}
function renderWave(){return heading('Wave Studio','捕获、信号源选择、游标、参考资产、Replay 与判定各有独立生命周期。',btn(s.capture?'■ 停止捕获':'● 开始捕获',s.capture?'capture-stop':'capture-start','',s.capture?'warn':'accent')+btn('保存参考','reference-save'),'MEASUREMENT / WAVEFORM')+`<div class="row wrap" style="margin-bottom:12px">${badge(s.source)}<select data-change="wave-source">${option(['DBC → CAN Hub','Replay → CAN Log','Reference → Asset'],s.waveSource)}</select><span class="chip">${s.source==='Mock'?'Synthesized':s.source==='Replay'?'ReplayTimestamp':'HostArrivalOnly'}</span><span class="chip ${s.capture?'good':''}">${s.capture?'● Capturing':'○ Idle'}</span><span class="push"></span><select data-change="wave-window">${option(['5','10','20'],String(s.waveWindow))}</select></div>`+card('波形工作区 / Time-series Visualization',`<div class="row wrap" style="margin-bottom:10px">${['EPB_Status','MotorCurrent','BatteryVoltage'].map((n,i)=>`<label class="chip" style="cursor:pointer"><input type="checkbox" data-change="wave-toggle" data-id="${n}" ${s.signalPlot.includes(n)?'checked':''}><span class="signal-dot ${['a','b','c'][i]}"></span>${n}</label>`).join('')}<label class="chip"><input type="checkbox" data-change="reference-toggle" ${s.reference?'checked':''}>参考曲线</label><span class="push"></span>${btn('游标居中','cursor-reset')} ${btn('分析判定','wave-judge','', 'accent')}</div>${waveformSVG()}<div class="row wrap" style="margin-top:10px"><span class="chip mono">Cursor A: ${s.waveCursor.toFixed(2)} s</span><span class="chip">参考：CurrentReference / rev 2</span><span class="chip ${s.waveVerdict==='PASS'?'good':s.waveVerdict==='FAIL'?'physical':''}">比较结果：${s.waveVerdict}</span><span class="push"></span>${btn('打开参考资源','references')}</div>`)+`<div class="grid2">`+card('游标、目标与实测值',table(['信号','当前值','单位','数据来源','质量'],s.dbcSignals.filter(x=>s.signalPlot.includes(x.name)).map(x=>`<tr><td><span class="signal-dot a"></span>${x.name}</td><td class="mono">${s.source==='Physical'?'—':x.value}</td><td>${x.unit}</td><td>${s.sou function palette(){let actions=[['project','打开工程中心','Project / Explorer'],['program','测试程序编辑器','Test / Authoring'],['run','运行与单步调试','Execution / Debug'],['can','CAN 监视与发送','CAN / Monitor'],['dbc','DBC 专业编辑','DBC / Database'],['controller','配置控制器状态','Controller / Mapping'],['bench','打开手动台架','Bench / Manual'],['wave','波形与参考比较','Wave / Capture'],['uds','UDS Console','UDS / Diagnostics'],['flash','CAN Flash 工具','Flash / Programming'],['production','扫码出厂','Production / EOL'],['records','历史报告','Records / Reporting'],['station','Station 连接','Devices / Station']];modal('命令搜索 · Ctrl+K',`<input id="paletteInput" class="w100" autofocus placeholder="输入工具名称、命令或关键词…"><div id="paletteMatches" style="margin-top:10px">${actions.map(([id,name,hint])=>`<div class="side-mini" data-action="palette-open" data-id="${id}"><div class="line1"><b>${tabs[id][0]} ${name}</b><small>${hint}</small></div></div>`).join('')}</div>`,btn('关闭 Esc','close-modal'));$('paletteInput').focus()}
function addStep(){let types=[['WaitCAN','等待 CAN Frame'],['Signal','读取 DBC 信号'],['Control','执行控制器状态'],['IF','IF / ELSE 条件'],['WHEN','WHEN / 等待条件'],['LOOP','循环 Repeat'],['WaveAssert','波形比较'],['UDS','UDS 服务'],['Flash','Flash Job'],['Record','记录结果'],['Delay','等待时间'],['Assert','断言'],['SWITCH','SWITCH Case'],['Call','子程序调用']];modal('插入测试节点',`<div class="info-banner">新节点插在当前节点后，继承当前 Scope。选择控制流节点后可在 Inspector 设置参数；这里只修改原型内存。</div><div class="service-grid">${types.map(([id,name])=>`<button class="service-btn" data-action="insert-step" data-id="${id}"><strong>${id}</strong><small>${name}</small></button>`).join('')}</div>`,btn('取消','close-modal'))}
function checkValidation(quiet=false){let bad=[];for(const st of s.steps){if(!st.source)bad.push(`${st.id} 缺少资源来源`);if(!Number.isFinite(+st.timeout)||+st.timeout<10)bad.push(`${st.id} 超时参数非法`)}for(const sig of s.dbcSignals){if(sig.start<0||sig.len<1||sig.start+sig.len>64)bad.push(`${sig.name} 位段超出 64 位`)}for(let i=0;i<s.dbcSignals.length;i++)for(let j=i+1;j<s.dbcSignals.length;j++){let a=s.dbcSignals[i],b=s.dbcSignals[j];if(a.msg===b.msg&&Math.max(a.start,b.start)<Math.min(a.start+a.len,b.start+b.len))bad.push(`${a.name} / ${b.name} 位布局重叠`)}if(!quiet)modal('工程 / 程序校验',`<div class="info-banner ${bad.length?'error':'success'}">${bad.length?`发现 ${bad.length} 项资源或定义错误`:'原型检查通过：节点参数和当前 DBC 位段没有明显冲突。'}</div>${bad.length?bad.map(x=>`<div class="side-mini red-text">• ${E(x)}</div>`).join(''):'<p class="message-text">真实校验还必须由 Project/PlanCompiler 执行接口、能力、资源租约、安全边界和冻结快照校验。这里仅为 UI 演示校验。</p>'}`,btn('知道了','close-modal'));return bad.length===0}
function stepAdvance(){if(s.debugState!=='running'&&s.debugState!=='paused')return;const ix=s.debugIndex+1;if(ix>=s.steps.length){endRun();return}let st=s.steps[ix];if(s.debugState==='running'&&s.breakpoints.includes(st.id)){s.debugState='paused';s.runEvents.unshift({time:dt(),level:'PAUSE',text:`命中断点 ${st.id} · ${st.name}`});clearInterval(runTimer);render();return} s.debugIndex=ix;let result=s.skipSteps.includes(st.id)||st.type==='ELSE'?'SKIP':'PASS';s.debugResults[st.id]=result;s.runEvents.unshift({time:dt(),level:result,text:`${st.id} / ${st.name} · Expected=${st.expected} / Actual=${result==='PASS'?'MOCK_VALUE':'未执行'}`});if(st.id==='T04')s.controllerValues.CTRL_PARK='Apply';if(st.id==='C01')s.controllerValues.CTRL_PARK='Neutral';if(ix>=s.steps.length-1)endRun();else render()}
function startRun(once=false){if(s.source==='Physical'){blocked('真实测试执行');return}if(s.source==='Replay'){toast('Replay 工作区只允许证据分析；含硬件输出的测试程序不可从 Replay 直接执行。','warn');return}if(!s.connected){toast('运行准备未通过：请先连接 Mock Station。','warn');openTab('station');return}if(s.dirty||s.dbcDirty||s.controllerDraft){toast('运行前请保存当前程序、DBC 和控制器配置，并重新校验引用。','warn');return}if(!checkValidation(true)){toast('Preflight 未通过：存在非法节点或 DBC 位定义。','error');return}if(s.debugState==='running')return;if(s.debugState==='paused'){s.debugState=once?'paused':'running';if(once){stepAdvance();}else{clearInterval(runTimer);runTimer=setInterval(stepAdvance,500)}render();return}
s.debugState=once?'paused':'running';s.debugIndex=-1;s.debugResults={};s.runEvents=[{time:dt(),level:'INFO',text:`Run Snapshot created · ${s.programName} / DUT ${s.runSerial} / source=${s.source}`}];toast('已启动 Mock 测试：不发送任何物理输出。');if(once){stepAdvance()}else{clearInterval(runTimer);runTimer=setInterval(stepAdvance,500)}openTab('run')}
function endRun(){clearInterval(runTimer);runTimer=null;s.debugState='done';s.runEvents.unshift({time:dt(),level:'PASS',text:'Mock Test Finished · RunRecord 已在浏览器本地创建'});let serial=s.productionPending||s.runSerial;let result=s.steps.some(st=>s.debugResults[st.id]==='FAIL')?'FAIL':'PASS';commitRecord(serial,result);s.productionPending=null;toast(`MOCK Run ${result}，已添加演示历史记录。`);render()}
function stopRun(){if(s.debugState!=='running'&&s.debugState!=='paused'){toast('当前没有正在运行的测试。','warn');return}clearInterval(runTimer);runTimer=null;s.debugState='stopped';s.runEvents.unshift({time:dt(),level:'ERROR',text:'用户停止 Mock Run · 未运行节点保留 NOT_RUN'});s.productionPending=null;toast('Mock Run 已停止，尚未自动提交 PASS。','warn');render()}
function commitRecord(serial,verdict){let unique=!s.records.some(r=>r.serial===serial),rec={id:'RUN-'+uid().slice(0,6),time:dt(),serial,verdict,source:s.source,newDut:unique,program:s.programName,dbcRev:s.dbcRev,steps:s.steps.length};s.records.unshift(rec);s.recordSelected=rec.id;persist();return rec}
function measure(){const c=s.controllers.find(x=>x.id===s.selectedController)||s.controllers[0];modal('录入五路电压测量事实',`<div class="info-banner warn">这是用户手工录入的测量记录，不是设备 ADC 实时反馈，也不能单独作为物理 PASS 证明。</div><div class="form-grid"><label>控制器</label><span>${E(c.name)}</span><label>状态</label><span>${E(s.controllerValues[c.id]||'未选择/未操作')}</span>${Array.from({length:5},(_,i)=>`<label>KEY_V${i+1} / V</label><input type="number" step="0.01" id="volt${i}" placeholder="例如 2.50">`).join('')}<label>仪表</label><input id="meterName" value="数字万用表 / 手工录入"></div>`,btn('取消','close-modal')+btn('提交测量事实','measure-save','', 'accent'))}
function report(id){let r=s.records.find(x=>x.id===id);if(!r){toast('选择一条记录后再生成报告。','warn');return}modal('Run Report · '+r.id,`<div class="info-banner">演示报告仅来自本地 Mock/Replay 事实，不是正式生产签发或 SAEF 证据。</div><div class="form-grid"><label>Run ID</label><span class="mono">${r.id}</span><label>DUT</label><span>${E(r.serial)}</span><label>Source</label>${badge(r.source)}<label>Verdict</label>${badge(r.verdict)}<label>Test Program</label><span>${E(r.program)}</span><label>DBC Revision</label><span>${r.dbcRev}</span><label>Step Count</label><span>${r.steps}</span><label>计入不同 DUT</label><span>${r.newDut?'是（首次出现）':'否（同一编号复测）'}</span></div>`,btn('关闭','close-modal')+btn('导出单页 HTML','report-export',r.id,'accent'))}
function download(name,data,type){let a=document.createElement('a');let url=URL.createObjectURL(new Blob([data],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function exportRecords(){let rows=[['Run ID','Time','Serial','Program','Verdict','Source','New DUT','DBC Rev'],...s.records.map(r=>[r.id,r.time,r.serial,r.program,r.verdict,r.source,r.newDut?'YES':'NO',r.dbcRev])];download('AutoTest_Demo_RunRecords.csv','\uFEFF'+rows.map(v=>v.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv;charset=utf-8');toast('已导出演示记录 CSV。')}
function reportExport(id){let r=s.records.find(x=>x.id===id);if(!r)return;let rows=[['Run ID',r.id],['DUT Serial',r.serial],['Time',r.time],['Verdict',r.verdict],['Source',r.source],['Program',r.program],['DBC Revision',r.dbcRev],['New DUT',r.newDut?'YES':'NO']];let html=`<!doctype html><html><head><meta charset="utf-8"><title>${E(r.id)} Demo Report</title><style>body{font-family:Segoe UI,'Microsoft YaHei',sans-serif;margin:50px;color:#1c3044}table{border-collapse:collapse;width:680px}td{padding:12px;border-bottom:1px solid #c8d5e2}h1{color:#1767a5}footer{margin-top:40px;color:#9b5d18}</style></head><body><h1>AutoTest / Demo Run Report</h1><p>Offline interactive UI prototype v0.1 · NOT A PHYSICAL TEST RECORD</p><table>${rows.map(x=>`<tr><td>${E(x[0])}</td><td>${E(x[1])}</td></tr>`).join('')}</table><footer>Prototype only · Data is generated in-browser and is not production evidence.</footer></body></html>`;download(r.id+'.html',html,'text/html;charset=utf-8');toast('已生成 HTML 演示报告。')}
const selectedStep=()=>s.steps.find(x=>x.id===s.selectedStep)||s.steps[0];
const selectedState=()=>{let c=s.controllers.find(x=>x.id===s.selectedController)||s.controllers[0];return [c,c.states.find(x=>x.id===s.selectedControlState)||c.states[0]]};
function handleAction(action,id,el){switch(action){

case'menu':{let items={文件:[['打开工程','project'],['保存','save'],['工程校验','validate']],编辑:[['新增测试步骤','step-add'],['保存','save'],['命令搜索','palette']],视图:[['工作台布局','palette'],['切换侧栏','toggle-sidebar'],['切换属性面板','toggle-inspector']],测试:[['编辑测试程序','program'],['运行监视','run'],['程序校验','validate']],设备:[['Station 管理','station'],['CAN Monitor','can'],['手动台架','bench']],工具:[['DBC Editor','dbc'],['Wave Studio','wave'],['UDS Console','uds'],['CAN Flash','flash']],帮助:[['原型说明','about'],['快捷键','shortcuts']]};modal(el?.dataset?.menu||'菜单',items[el?.dataset?.menu]?.map(([name,id])=>`<div class="side-mini" data-action="menu-pick" data-id="${id}">${name}</div>`).join('')||'',btn('关闭','close-modal'));break}

case'theme':s.theme=s.theme==='dark'?'light':'dark';persist();render();break;
case'density':s.density=s.density==='compact'?'comfortable':'compact';persist();render();break;
case'toggle-sidebar':s.sidebarHidden=!s.sidebarHidden;render();break;case'toggle-inspector':s.inspectorHidden=!s.inspectorHidden;render();break;

case'save':save();break;case'validate':checkValidation();break;case'references':modal('资源引用关系 / Dependency Graph',`<div class="info-banner">工程定义在编辑态变化时需向引用者发出诊断，不直接改变已冻结的 RunSnapshot。</div>${table(['资源','引用者','版本规则'],[['DBC / EPB_Status','Test Steps T02 / T03 / T05','SignalRef + rev'],['Controller / Apply','Bench / T04 / Cleanup','ControllerId + StateId + rev'],['Station / DUT_CAN','CAN / DBC / UDS / Program','Endpoint binding'],['Wave / CurrentReference','Wave Studio / T08','AssetRef + Hash'],['Image / HEX','Flash ProgrammingJob','Image Hash / ECU profile'],['Identity Rules','Scan / Production','RuleSet rev']].map(v=>`<tr>${v.map(c=>`<td>${c}</td>`).join('')}</tr>`).join(''))}`,btn('关闭','close-modal'));break;
case'about':modal('关于 AutoTest UI Prototype',`<p>本原型是一个可离线运行的交互性设计验证工具，用于审阅用户行为、信息架构及专业工具协作，不是 WPF 成品或真实设备测试。</p><p>版本：0.1 · 首版候选 · 不代表用户批准。</p><p>数据：Local Mock / Replay demo / Physical locked。当前浏览器本地保存部分编辑数据，可通过“重置演示”恢复。</p>`,btn('关闭','close-modal'));break;
case'shortcuts':modal('操作快捷键',table(['快捷键','命令'],[['Ctrl+K','命令搜索'],['Ctrl+S','保存'],['Ctrl+Tab','下一文档'],['F5','开始/继续 Mock 测试'],['F10','单步执行'],['Shift+F5','停止运行'],['Esc','关闭菜单/弹窗'],['Delete','删除选中程序节点（编辑器中）'],['双击资源','打开对应专业文档'],['右键节点','上下文菜单'],['拖动节点','同 Scope 内调整顺序']].map(x=>`<tr><td class="mono">${x[0]}</td><td>${x[1]}</td></tr>`).join('')),btn('关闭','close-modal'));break;
case'discover':if(s.source==='Physical')blocked('设备枚举');else toast('已发现一台 MOCK Station；扫码枪不在设备候选中。');break;
case'connect':if(s.source==='Physical'){blocked('WinUSB 真实连接');return}s.connected=!s.connected;if(!s.connected){stopTrace(false);clearInterval(waveTimer);s.capture=false;}toast(s.connected?'Mock Station 已连接：GEN-0004（仿真身份）。':'Mock Station 已断开：所有订阅与输出状态失效。');render();break;
case'ping':if(s.source==='Physical'){blocked('物理 PING');return}s.connected?toast('MOCK PONG / 19ms · 不代表真实硬件可用。'):toast('设备未连接。','warn');break;
case'read-state':if(s.source==='Physical')blocked('物理状态读取');else s.connected?toast('MOCK 状态读取完成；回读仅为仿真来源。'):toast('未连接 Station。','warn');break;
case'start-monitor':startTrace();break;case'stop-monitor':stopTrace();render();break;case'pause-trace':s.tracePause=!s.tracePause;toast(s.tracePause?'冻结了 UI 接收显示。':'恢复监视显示。');render();break;

case'frame-to-tx':{let f=s.frames.find(x=>x.seq===s.selectedFrame);if(!f){toast('请先选中 CAN 帧。','warn');return}s.canId='0x'+f.id;s.canData=f.data;openTab('can');toast('已复制到 CAN 发送编辑器；未执行发送。');break}

case'dbc-add':{let name='Signal_'+(s.dbcSignals.length+1),last=s.dbcSignals.filter(x=>x.msg===s.selectedMessage).at(-1),start=last?Math.min(63,last.start+last.len):0;s.dbcSignals.push({name,msg:s.selectedMessage,start,len:1,scale:1,offset:0,unit:'raw',value:0});s.selectedSignal=name;s.dbcDirty=true;render();break}

case'uds-send':{if(s.source!=='Mock'){blocked('UDS 请求发送');return}if(!s.connected){toast('请先连接 Mock Station。','warn');return}if(s.debugState==='running'){toast('CAN 资源正在被 RunContext 占用。','warn');return}let req=s.udsService+' '+s.udsDid.replace(/[^0-9a-f]/gi,'').replace(/(..)/g,'$1 ').trim();s.udsTx=req;let safe=['10','19','22','3E'];let positive=safe.includes(s.udsService);s.udsRx=positive?(Number.parseInt(s.udsService,16)+0x40).toString(16).toUpperCase()+(s.udsService==='22'?' '+s.udsDid+' 44 45 4D 4F':' 00'):'7F '+s.udsService+' 33';s.udsHistory.unshift({time:dt(),kind:'RX',text:s.udsRx+(positive?' · Mock PositiveResponse':' · Mock NRC SecurityAccessDenied')});s.udsHistory.unshift({time:dt(),kind:'TX',text:req+' · Mock TX'});s.udsHistory=s.udsHistory.slice(0,70);toast(positive?'已返回 Mock UDS 响应。':'Mock 返回 NRC 0x33（示范危险服务保护）。','info');render();break}

case'uds-session':if(s.source!=='Mock'){blocked('UDS 会话切换');return}s.udsSession=s.udsSession==='默认会话'?'扩展诊断会话（DEMO）':'默认会话';toast('已模拟 UDS Session 状态切换。');render();break;
case'uds-insert':{let n={id:'U'+uid().slice(0,3),scope:'测试',type:'UDS',name:'UDS 0x'+s.udsService+' 请求',summary:s.udsService+' '+s.udsDid,source:'DUT_CAN/0x321',expected:'PositiveResponse',timeout:5000};snapshotSteps();s.steps.push(n);s.selectedStep=n.id;markDirty();openTab('program');toast('UDS 调试请求已生成测试节点草案；尚未保存/验证。');break}
case'flash-preflight':if(s.flashImage.startsWith('INCOMPATIBLE')){toast('Image / Profile 不匹配：禁止开始编程。','error')}else toast('Mock 预检通过：镜像/目标 Profile 仅为演示匹配。');break;
case'flash-run':if(s.source!=='Mock'){blocked('Flash 编程');return}if(!s.connected){toast('Flash Preflight：Mock Station 尚未连接。','warn');return}if(s.flashImage.startsWith('INCOMPATIBLE')){toast('镜像与 Profile 不匹配，已阻止模拟编程。','error');return}if(s.debugState==='running'){toast('测试 Run 占用 DUT/总线租约，Flash 无法并发。','warn');return}s.flashState='running';s.flashProgress=0;clearInterval(flashTimer);flashTimer=setInterval(()=>{s.flashProgress=Math.min(100,s.flashProgress+5);s.flashStage=Math.floor(s.flashProgress/20);if(s.flashProgress>=100){clearInterval(flashTimer);s.flashState='done';toast('Mock Bootloader 流程完成 · 无真实物理擦写。')}if(s.active==='flash')render()},180);toast('Mock Flash Job 已启动。');render();break;
case'flash-cancel':clearInterval(flashTimer);s.flashState='cancelled';toast('已中止 Mock Flash Job；真实场景须保留恢复路径。','warn');render();break;
case'step-select':s.selectedStep=id;s.inspector='step';render();break;
case'step-add':addStep();break;
case'insert-step':{let i=s.steps.findIndex(x=>x.id===s.selectedStep);let scope=i>=0?s.steps[i].scope:'测试';const name={WaitCAN:'等待 CAN Frame',Signal:'读取信号',Control:'控制器状态操作',IF:'如果条件满足',WHEN:'等待条件',LOOP:'重复执行',WaveAssert:'比较波形参考',UDS:'UDS 服务请求',Flash:'CAN Flash Job',Record:'记录执行事实',Delay:'等待时间',Assert:'断言 Signal',SWITCH:'按条件分支',Call:'调用子程序'}[id]||id;let n={id:'N'+uid().slice(0,4),scope,name,type:id,summary:'待配置 · 点击右侧编辑',source:id==='WaveAssert'?'CurrentReference':id==='Control'?'ParkingSwitch.Neutral':id==='WaitCAN'?'DUT_CAN/0x321':'EPB_Status',expected:'待配置',timeout:1000};snapshotSteps();s.steps.splice(i+1,0,n);s.selectedStep=n.id;markDirty();closeModal();openTab('program');toast(`${name} 已插入 ${scope} 阶段；请配置资源与参数。`);break}
case'step-delete':{let index=s.steps.findIndex(x=>x.id===s.selectedStep);if(index<0)return;let n=s.steps[index];snapshotSteps();s.steps.splice(index,1);s.selectedStep=s.steps[Math.min(index,s.steps.length-1)]?.id;markDirty();toast(`已删除节点 ${n.id}（原型内存）。`);render();break}
case'step-copy':{let index=s.steps.findIndex(x=>x.id===s.selectedStep);if(index<0)return;let n={...s.steps[index],id:'N'+uid().slice(0,4),name:s.steps[index].name+' 副本'};snapshotSteps();s.steps.splice(index+1,0,n);s.selectedStep=n.id;markDirty();render();break}
case'step-up':case'step-down':{let a=s.steps.findIndex(x=>x.id===s.selectedStep),b=a+(action==='step-up'?-1:1);if(a<0||b<0||b>=s.steps.length||s.steps[a].scope!==s.steps[b].scope){toast('只能在同一 Scope 中移动步骤。','warn');return}snapshotSteps();[s.steps[a],s.steps[b]]=[s.steps[b],s.steps[a]];markDirty();render();break}
case'breakpoint':{if(s.breakpoints.includes(id))s.breakpoints=s.breakpoints.filter(x=>x!==id);else s.breakpoints.push(id);render();break}
case'skip-step':{if(s.skipSteps.includes(id))s.skipSteps=s.skipSteps.filter(x=>x!==id);else s.skipSteps.push(id);render();break}
case'run-to':{if(!id)return;const index=s.steps.findIndex(x=>x.id===id);if(index<0)return;s.breakpoints=[id];toast(`已在 ${id} 放置断点。启动后会暂停在此节点之前。`);openTab('run');break}
case'step-ref':{let st=selectedStep(),source=st.source;source.includes('ParkingSwitch')?openTab('controller'):source.includes('Current')?openTab('wave'):source==='EPB_Status'||source==='MotorCurrent'||source==='BatteryVoltage'?(s.selectedSignal=source,openTab('dbc')):openTab('station');break}
case'undo':if(!s.undoStack.length){toast('没有可撤销的步骤事务。','warn');break}s.redoStack.push(JSON.stringify(s.steps));s.steps=JSON.parse(s.undoStack.pop());if(!s.steps.some(x=>x.id===s.selectedStep))s.selectedStep=s.steps.at(-1)?.id;markDirty();toast('已撤销一步测试程序编辑。');render();break;
case'redo':if(!s.redoStack.length){toast('没有可重做的步骤事务。','warn');break}s.undoStack.push(JSON.stringify(s.steps));s.steps=JSON.parse(s.redoStack.pop());markDirty();toast('已重做一步测试程序编辑。');render();break;
case'run':startRun();break;
case'pause-run':if(s.debugState==='running'){s.debugState='paused';clearInterval(runTimer);toast('Mock Run 已暂停。');render()}else if(s.debugState==='paused')startRun();break;

case'stop':stopRun();break;
case'scan-validate':{let sn=s.scanText.trim().toUpperCase();if(!sn){toast('请先扫描或输入 DUT Serial。','warn');return}s.scanText=sn;if(!/^(EPB|ECU)-[A-Z0-9-]{4,24}$/.test(sn)){s.scanStatus='不匹配：演示规则要求 EPB-/ECU- 前缀';toast('条码不匹配演示规则。','error')}else{s.scanStatus=s.records.some(r=>r.serial===sn)?'已存在：复测不会计入新增 DUT':'匹配成功：首次 DUT';toast(s.scanStatus)}render();break}
case'scan-run':{if(s.source!=='Mock'){blocked('生产测试');return}let sn=s.scanText.trim().toUpperCase();if(!/^(EPB|ECU)-[A-Z0-9-]{4,24}$/.test(sn)){toast('扫码规则校验未通过。','warn');return}s.productionPending=sn;s.runSerial=sn;s.debugState='idle';startRun();break}
case'record-select':s.recordSelected=id;openTab('records');break;
case'report':report(id);break;case'report-export':reportExport(id);break;

case'reset-records':modal('清空演示历史',`<p>即将删除浏览器本地的演示执行记录，不会影响真实项目或磁盘工程文件。</p>`,btn('取消','close-modal')+btn('确定清空','reset-records-confirm','', 'danger-outline'));break;

default:toast('此操作尚未在原型中定义：'+action,'warn');}}
function handleChange(el){let key=el.dataset.change;if(!key)return;let v=el.type==='checkbox'?el.checked:el.value;if(key.startsWith('step-')){snapshotSteps();let st=selectedStep();if(key==='step-name')st.name=v;else if(key==='step-source')st.source=v;else if(key==='step-expected')st.expected=v;else if(key==='step-timeout')st.timeout=Number(v);st.summary=st.source+' · '+st.expected;markDirty();render();return}
if(key.startsWith('dbc-')){let sig=s.dbcSignals.find(x=>x.name===s.selectedSignal);if(!sig)return;if(key==='dbc-name'){if(s.dbcSignals.some(x=>x!==sig&&x.name===v)||!v.trim()){toast('信号名不能为空或重复。','warn');render();return}sig.name=v;s.selectedSignal=v}else if(key==='dbc-start')sig.start=Number(v);else if(key==='dbc-len')sig.len=Number(v);else if(key==='dbc-scale')sig.scale=Number(v);else if(key==='dbc-unit')sig.unit=v;s.dbcDirty=true;render();return}
if(key==='state-name'||key==='state-mode'){let [c,st]=selectedState();if(key==='state-name')st.name=v;else st.mode=v;s.controllerDraft=true;markDirty();render();return}
if(key==='controller-select'){s.selectedController=v;s.selectedControlState=s.controllers.find(c=>c.id===v)?.states[0]?.id;render();return}
switch(key){case'can-id':s.canId=v;break;case'can-data':s.canData=v;break;case'can-period':s.canPeriodMs=Math.max(100,Number(v)||100);break;case'can-dir':s.canDir=v;render();break;case'wave-source':s.waveSource=v;render();break;case'wave-window':s.waveWindow=Number(v);s.waveCursor=s.waveWindow/2;render();break;case'wave-toggle':s.signalPlot=v?(s.signalPlot.includes(el.dataset.id)?s.signalPlot:[...s.signalPlot,el.dataset.id]):s.signalPlot.filter(x=>x!==el.dataset.id);render();break;case'reference-toggle':s.reference=v;render();break;case'uds-did':s.udsDid=v;render();break;case'flash-image':s.flashImage=v;render();break;case'run-serial':s.runSerial=v;break;case'run-variant':s.runVariant=v;renderChrome();break}}
function rerenderWithFocus(renderFn,id){let el=$(id),pos=el?.selectionStart??0;renderFn();let next=$(id);if(next){next.focus();try{next.setSelectionRange(pos,pos)}catch{}}}
document.addEventListener('click',ev=>{if(!ev.target.closest('#contextMenu'))$('contextMenu').classList.add('hidden');let el=ev.target.closest('[data-action]');if(!el)return;let action=el.dataset.action,id=el.dataset.id||'';if(action==='close-tab')ev.stopPropagation();handleAction(action,id,el)});
document.addEventListener('dblclick',ev=>{let el=ev.target.closest('.tree-item');if(el)openTab(el.dataset.id)});
document.addEventListener('change',ev=>handleChange(ev.target));
document.addEventListener('input',ev=>{let el=ev.target,key=el.dataset.input;if(key==='scan'){s.scanText=el.value;s.scanStatus='待匹配';return}if(key==='step-search'){s.stepSearch=el.value;{let pos=el.selectionStart;$('workbody').innerHTML=renderProgram();let i=document.querySelector('[data-input="step-search"]');if(i){i.focus();i.setSelectionRange(pos,pos)}}return}if(key==='can-filter'){s.canFilter=el.value;let pos=el.selectionStart;$('workbody').innerHTML=renderCan();let i=document.querySelector('[data-input="can-filter"]');if(i){i.focus();i.setSelectionRange(pos,pos)}return}if(key==='record-filter'){s.recordFilter=el.value;let pos=el.selectionStart;$('workbody').innerHTML=renderRecords();let i=document.querySelector('[data-input="record-filter"]');if(i){i.focus();i.setSelectionRange(pos,pos)}return}if(el.id==='treeSearch'){let pos=el.selectionStart;s.treeFilter=el.value;renderSidebar();let i=$('treeSearch');if(i){i.focus();i.setSelectionRange(pos,pos)}return}if(el.id==='paletteInput'){let q=el.value.toLowerCase();document.querySelectorAll('#paletteMatches .side-mini').forEach(i=>i.style.display=i.textContent.toLowerCase().includes(q)?'':'none')}});
document.addEventListener('keydown',ev=>{if(ev.ctrlKey&&ev.key.toLowerCase()==='k'){ev.preventDefault();palette();return}if(ev.ctrlKey&&ev.key.toLowerCase()==='s'){ev.preventDefault();save();return}if(ev.ctrlKey&&ev.key==='Tab'){ev.preventDefault();let i=s.opened.indexOf(s.active);openTab(s.opened[(i+1)%s.opened.length]);return}if(ev.key==='Escape'){closeModal();$('contextMenu').classList.add('hidden');return}if(ev.key==='F5'&&!ev.shiftKey){ev.preventDefault();startRun();return}if(ev.key==='F10'){ev.preventDefault();startRun(true);return}if(ev.key==='F5'&&ev.shiftKey){ev.preventDefault();stopRun();return}if(ev.key==='Enter'&&ev.target.id==='scanInput'){ev.preventDefault();handleAction('scan-validate');return}if(ev.key==='Enter'&&ev.target.id==='paletteInput'){let item=[...document.querySelectorAll('#paletteMatches .side-mini')].find(x=>x.style.display!=='none');if(item){closeModal();openTab(item.dataset.id)}return}if(ev.key==='Delete'&&s.active==='program'&&!['INPUT','TEXTAREA'].includes(ev.target.tagName)&&!s.modal){handleAction('step-delete')}});
document.addEventListener('contextmenu',ev=>{let el=ev.target.closest('.step-row,.tree-item');if(!el)return;ev.preventDefault();let cm=$('contextMenu');let id=el.dataset.id;if(el.classList.contains('step-row')){s.selectedStep=id;let actions=[['在此节点设置/移除断点','breakpoint'],['运行到此节点','run-to'],['跳过 / 恢复步骤','skip-step'],['定位资源引用','step-ref'],['复制步骤','step-copy'],['删除步骤','step-delete']];cm.innerHTML=actions.map(([title,action])=>`<button data-action="${action}" data-id="${id}">${title}</button>`).join('');renderInspector()}else{let actions=[['在工作区打开','tab'],['查看资源引用','references']];cm.innerHTML=actions.map(([title,action])=>`<button data-action="${action}" data-id="${id}">${title}</button>`).join('')}cm.style.left=Math.min(ev.clientX,innerWidth-230)+'px';cm.style.top=Math.min(ev.clientY,innerHeight-260)+'px';cm.classList.remove('hidden')});
let dragged=null;document.addEventListener('dragstart',ev=>{let row=ev.target.closest('[data-drag-step]');if(row){dragged=row.dataset.dragStep;row.classList.add('dragging');ev.dataTransfer.effectAllowed='move';ev.dataTransfer.setData('text/plain',dragged)}});document.addEventListener('dragover',ev=>{if(dragged&&ev.target.closest('[data-drag-step]'))ev.preventDefault()});document.addEventListener('drop',ev=>{let row=ev.target.closest('[data-drag-step]');if(!row||!dragged)return;ev.preventDefault();let a=s.steps.findIndex(x=>x.id===dragged),b=s.steps.findIndex(x=>x.id===row.dataset.dragStep);if(a>=0&&b>=0&&s.steps[a].scope===s.steps[b].scope){snapshotSteps();let [item]=s.steps.splice(a,1);s.steps.splice(b,0,item);markDirty();toast('已调整步骤顺序（同 Scope）。');render()}else toast('仅允许在同一 Scope 内移动节点。','warn');dragged=null});document.addEventListener('dragend',()=>{dragged=null;document.querySelectorAll('.dragging').forEach(el=>el.classList.remove('dragging'))});
$('sourceSelect').addEventListener('change',ev=>setSource(ev.target.value));$('workspaceSelect').addEventListener('change',ev=>{s.workspace=ev.target.value;openTab(ev.target.value==='production'?'production':ev.target.value==='analysis'?'wave':'program')});
document.addEventListener('pointerdown',ev=>{let diagram=ev.target.closest('#waveDiagram');if(diagram){let rect=diagram.getBoundingClientRect(),fraction=Math.min(1,Math.max(0,(ev.clientX-rect.left)/rect.width));s.waveCursor=+(s.waveWindow*Math.min(1,Math.max(0,(fraction-.044)/.939))).toFixed(2);render()}});
let sizeInfo=null;['leftSizer','rightSizer'].forEach(id=>$(id).addEventListener('pointerdown',ev=>{sizeInfo={id,startX:ev.clientX,startWidth:id==='leftSizer'?(s.sideWidth||255):(s.rightWidth||286)};ev.target.setPointerCapture(ev.pointerId)}));document.addEventListener('pointermove',ev=>{if(!sizeInfo)return;let delta=ev.clientX-sizeInfo.startX;if(sizeInfo.id==='leftSizer')s.sideWidth=Math.max(175,Math.min(440,sizeInfo.startWidth+delta));else s.rightWidth=Math.max(220,Math.min(470,sizeInfo.startWidth-delta));renderChrome()});document.addEventListener('pointerup',()=>sizeInfo=null);
$('clockText').textContent='LOCAL · '+dt();setInterval(()=>$('clockText').textContent='LOCAL · '+dt(),1000);
