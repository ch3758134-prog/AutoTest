name: Field Studio — Windows real hardware UI build

on:
  push:
    branches: [feature/real-hardware-studio-20261109]
  pull_request:
    branches: [main]
    paths:
      - 'src/AutoTest.FieldStudio/**'
      - 'src/AutoTest.Devices/**'
      - 'src/AutoTest.Specialists/**'
      - '.github/workflows/field-studio-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  field-studio:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
      - name: Set up pinned SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.400'
      - name: Record exact SHA
        shell: pwsh
        run: |
          git rev-parse HEAD
          dotnet --version
      - name: Restore real Field Studio
        shell: pwsh
        run: dotnet restore src/AutoTest.FieldStudio/AutoTest.FieldStudio.csproj
      - name: Build new WPF UI and services
        shell: pwsh
        run: dotnet build src/AutoTest.FieldStudio/AutoTest.FieldStudio.csproj -c Release --no-restore --verbosity minimal
      - name: Restore existing back-end tests
        shell: pwsh
        run: dotnet restore AutoTest.Backend.slnf
      - name: Restore compile-negative fixture
        shell: pwsh
        run: dotnet restore tests/negative/StrongIdMisuse/StrongIdMisuse.csproj
      - name: Build back-end and test projects
        shell: pwsh
        run: dotnet build AutoTest.Backend.slnf -c Release --no-restore --verbosity minimal
      - name: Run Device physical boundary tests
        shell: pwsh
        run: dotnet test tests/AutoTest.Devices.Tests/AutoTest.Devices.Tests.csproj -c Release --no-build --no-restore --verbosity normal
      - name: Run UDS Wave Scan Flash parsing tests
        shell: pwsh
        run: dotnet test tests/AutoTest.Specialists.Tests/AutoTest.Specialists.Tests.csproj -c Release --no-build --no-restore --verbosity normal
      - name: Publish Windows lab application
        shell: pwsh
        run: dotnet publish src/AutoTest.FieldStudio/AutoTest.FieldStudio.csproj -c Release -r win-x64 --self-contained false -o output/FieldStudio --verbosity minimal
      - name: Upload runnable Windows application
        uses: actions/upload-artifact@v4
        with:
          name: AutoTest-FieldStudio-Windows-x64
          path: output/FieldStudio/
          if-no-files-found: error
          retention-days: 14
