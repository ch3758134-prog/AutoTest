(()=>{const D=JSON.parse(document.getElementById("dataset").textContent),input=document.getElementById("search"),list=document.getElementById("list"),detail=document.getElementById("detail"),count=document.getElementById("count");

function token(r){return [r.id,r.title,r.kind,...r.mcus.map(x=>"U7P"+x),...r.j1.map(x=>"J1"+x),...r.nets,...r.fw_names,...r.nodes.map(x=>x.name)].join(" ")}
function show(r){detail.innerHTML='<h2>'+esc(r.title)+'</h2><p class="muted">'+esc(r.kind)+' · '+esc(r.evidence)+'</p>'+(r.status==="PARTIAL"?'<div class="warn">部分器件引脚未核对，下面不代表逐脚完整网表。</div>':'')+'<h3>电气路径</h3>'+r.nodes.map(n=>'<div class="step"><b>'+esc(n.name)+'</b><small>'+esc(n.role)+' · 图纸第'+esc(n.page)+'页</small></div>').join('')+'<h3>电路如何工作</h3><p>'+esc(r.hardware_logic)+'</p><h3>对软件的限制</h3><p class="fact">'+esc(r.software_rule)+'</p>'+(r.coupled?'<h3>共用硬件</h3><p>'+esc(r.coupled)+'</p>':'')+'<h3>固件历史来源</h3>'+(r.firmware.length?r.firmware.map(x=>'<p><a target="_blank" href="'+x.url+'">'+esc(x.symbol)+' / '+esc(x.path)+'</a></p>').join(''):'未登记对应业务接口')+'<div class="warn">待确认：'+esc(r.unknown)+'</div>';}
function showEnd(x){detail.innerHTML='<h2>'+esc(x.id)+'</h2><p>设计网：'+esc(x.design_net||"未登记")+'</p>'+(x.route_ids.length?x.route_ids.map(id=>'<button class="res" data-route="'+esc(id)+'">查看关联电路 '+esc(id)+'</button>').join(''):'<div class="warn">该端点的器件级路径尚未收录；不代表该引脚未连接或可自由使用。</div>');}
function update(){const q=clean(input.value.trim());let rs=D.routes.filter(x=>clean(token(x)).includes(q));if(q){rs.sort((a,b)=>(b.nets.some(x=>clean(x)===q)?1:0)-(a.nets.some(x=>clean(x)===q)?1:0))}else rs=rs.slice(0,9);const es=q?D.endpoints.filter(x=>clean([x.id,x.pad,x.design_net,x.physical_pin,x.contact].join(" ")).includes(q)):[];count.textContent=q?rs.length+" 条电路 + "+es.length+" 个物理端点":"共30条电路、100个MCU脚、64个J1触点";list.innerHTML=rs.map(r=>'<button class="res" data-route="'+r.id+'"><span class="tag">'+esc(r.kind)+'</span> <b>'+esc(r.title)+'</b><small>'+esc(r.mcus.map(x=>"U7 P"+x).join("/"))+" · "+esc(r.j1.map(x=>"J1 "+x).join("/"))+'</small></button>').join('')+es.slice(0,80).map(e=>'<button class="res" data-end="'+e.id+'"><span class="tag">物理端点</span> <b>'+esc(e.id)+'</b><small>'+esc(e.design_net||"未标Net")+'</small></button>').join('');if(rs.length)show(rs[0]);else if(es.length)showEnd(es[0]);else detail.textContent="无匹配结果";}
input.addEventListener("input",update);list.addEventListener("click",ev=>{let b=ev.target.closest("button");if(!b)return;if(b.dataset.route)show(D.routes.find(x=>x.id===b.dataset.route));else if(b.dataset.end)showEnd(D.endpoints.find(x=>x.id===b.dataset.end));});update();
