name: One-time Project Control branch cleanup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/project-control-branch-cleanup-once.yml'
permissions:
  contents: write
jobs:
  remove-exact-project-control-branches:
    if: github.repository == 'ch3758134-prog/AutoTest' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Remove exactly five obsolete management branches
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            "management/evolutionary-lifecycle-pilot-20261109"
            "management/project-control-clean-20261111"
            "management/project-control-portable-init-20261111"
            "management/project-control-rebuild-20261111"
            "management/project-control-redesign-20261111"
          )
          for b in "${branches[@]}"; do
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${b}" >/dev/null 2>&1; then
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${b}" >/dev/null
              echo "DELETED ${b}"
            else
              echo "ALREADY_ABSENT ${b}"
            fi
          done
          for b in "${branches[@]}"; do
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${b}" >/dev/null 2>&1; then
              echo "::error::Branch still exists: ${b}"
              exit 1
            fi
          done
          echo "All five requested management branches are absent."
