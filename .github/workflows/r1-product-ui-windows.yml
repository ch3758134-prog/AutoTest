name: R1 product UI Windows build

on:
  push:
    branches: [feature/r1-html-product-ui-20261110, feature/r1-v6-selective-testcases-20261110, feature/r1-unified-ide-shell-rebuild-20261111]
  pull_request:
    branches: [main]
    paths:
      - 'src/AutoTest.Desktop/**'
      - 'docs/ui-r1/**'
      - 'tests/AutoTest.Desktop.Tests/**'
      - '.github/workflows/r1-product-ui-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r1-product-ui:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
      - name: Use pinned .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.400'
      - name: Print exact commit
        shell: pwsh
        run: |
          git rev-parse HEAD
          dotnet --version
      - name: Restore formal Desktop
        shell: pwsh
        run: dotnet restore src/AutoTest.Desktop/AutoTest.Desktop.csproj
      - name: Build formal R1 Desktop
        shell: pwsh
        run: dotnet build src/AutoTest.Desktop/AutoTest.Desktop.csproj -c Release --no-restore --verbosity minimal
      - name: Run WPF UI model tests
        shell: pwsh
        run: dotnet test tests/AutoTest.Desktop.Tests/AutoTest.Desktop.Tests.csproj -c Release --verbosity normal
      - name: Publish formal R1 candidate
        shell: pwsh
        run: dotnet publish src/AutoTest.Desktop/AutoTest.Desktop.csproj -c Release -r win-x64 --self-contained false -o output/AutoTest.R1 --verbosity minimal
      - name: WPF startup smoke test (no device connection or ECU commands)
        shell: pwsh
        run: |
          $exe = Join-Path (Resolve-Path 'output/AutoTest.R1').Path 'AutoTest.Desktop.exe'
          $stdErr = Join-Path $env:RUNNER_TEMP 'r1-startup-stderr.log'
          $stdOut = Join-Path $env:RUNNER_TEMP 'r1-startup-stdout.log'
          $proc = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru -RedirectStandardError $stdErr -RedirectStandardOutput $stdOut
          try {
            Start-Sleep -Seconds 6
            $proc.Refresh()
            if ($proc.HasExited) {
              Write-Host "R1_WPF_STARTUP_EARLY_EXIT: $($proc.ExitCode)"
              if (Test-Path $stdErr) { Get-Content $stdErr }
              if (Test-Path $stdOut) { Get-Content $stdOut }
              throw "R1 WPF process exited before startup smoke window."
            }
            Write-Host "R1_WPF_STARTUP_SURVIVED_6_SECONDS"
          }
          finally {
            $proc.Refresh()
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          }
      - name: Store build evidence (not formal delivery)
        uses: actions/upload-artifact@v4
        with:
          name: AutoTest-R1-Product-UI-Windows-Validation
          path: output/AutoTest.R1/
          retention-days: 7
          if-no-files-found: error
