<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Engineering Workbench · 工程研发管理</title>
<style>
:root{color-scheme:light;--bg:#f5f7fa;--paper:#fff;--line:#e1e7ef;--ink:#223247;--soft:#62758c;--quiet:#8b9bad;--blue:#225fb1;--pale:#eaf2fd;--good:#147a56;--gold:#9f6a19;--bad:#ba4b4d}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:14px/1.65 "Segoe UI","Microsoft Yahei UI",sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #6295df;outline-offset:2px}
button:disabled{cursor:not-allowed;opacity:.5}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{background:var(--paper);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:16px;position:sticky;top:0;height:100vh}
.identity{padding:0 12px 20px;border-bottom:1px solid var(--line)}.identity strong{font-size:20px;letter-spacing:-.6px}.identity em{font-style:normal;color:var(--blue)}.identity small{display:block;color:var(--soft);font-size:11px}
.projectpicker{padding:1px 8px 10px;border-bottom:1px solid var(--line)}.projectpicker label,.sideheading{font-size:11px;color:var(--quiet);display:block;margin-bottom:7px}.projectpicker select{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
.nav{display:grid;gap:3px}.nav button{border:0;background:transparent;text-align:left;padding:11px 13px;border-radius:7px;color:#506783;display:flex;gap:11px;align-items:center}.nav button.active{background:var(--pale);color:var(--blue);font-weight:650}.nav button:hover{background:#f0f5fb}.nav b{font-size:17px;width:22px;text-align:center;font-weight:500}
.sidefoot{margin-top:auto;border-top:1px solid var(--line);padding:14px 12px;color:var(--quiet);font-size:11px}.sidefoot .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#23a879;margin-right:7px}
.main{min-width:0;padding:24px clamp(20px,4vw,58px) 80px;max-width:1540px;width:100%;margin:0 auto}
.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:28px;font-size:12px;color:var(--soft)}
.top-actions{display:flex;gap:9px;align-items:center}
.page-title{font-size:27px;margin:0;letter-spacing:-.6px;line-height:1.3}.intro{margin:8px 0 23px;color:var(--soft);font-size:13px;line-height:1.8}
button.primary{background:var(--blue);color:white;border:1px solid var(--blue);border-radius:7px;font-weight:600;padding:9px 14px}button.primary:hover{background:#184f99}
button.outline{background:white;color:#375877;border:1px solid #cad6e3;border-radius:7px;padding:9px 13px}button.outline:hover{background:#f0f5fc}
button.link{background:none;border:0;color:var(--blue);padding:4px 0;font-weight:650}button.link:hover{text-decoration:underline}
.buttonrow{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:19px 22px}
.panel h2{font-size:16px;margin:0 0 10px}.panel p{color:var(--soft);margin:0}
.stack{display:grid;gap:15px}.twocol{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(300px,1fr);gap:15px}.threecol{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.fourcol{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{border:1px solid var(--line);background:#fff;border-radius:9px;padding:15px 18px}.stat b{font-size:25px;line-height:1.35}.stat label{display:block;color:var(--soft);font-size:12px}.stat small{display:block;color:var(--quiet);font-size:11px;margin-top:4px}
.section{margin-top:25px}.sectionline{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:12px}.sectionline h2{font-size:16px;margin:0}.muted{color:var(--soft)}.tiny{font-size:11px;color:var(--quiet)}
.badge{display:inline-block;padding:2px 8px;border-radius:5px;font-size:11px;background:#edf1f6;color:#50667e;white-space:nowrap}.badge.good{background:#e6f5ee;color:var(--good)}.badge.warn{background:#fff4de;color:var(--gold)}.badge.bad{background:#ffecec;color:var(--bad)}.badge.blue{background:#e8f1fd;color:var(--blue)}
.rowlist{display:grid;gap:0}.item-row{display:flex;text-align:left;align-items:center;justify-content:space-between;gap:12px;background:#fff;border:0;border-bottom:1px solid var(--line);padding:12px 0;width:100%}.item-row:last-child{border-bottom:0}.item-row:hover .rowtitle{color:var(--blue)}.rowtitle{font-weight:600;color:#283d57;overflow-wrap:anywhere}.rowdesc{font-size:12px;color:var(--soft);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.blank{background:#fff;border:1px dashed #bdcbdc;border-radius:12px;padding:36px 22px;text-align:center}.blank h2{margin:0 0 9px}.blank p{color:var(--soft);max-width:650px;margin:0 auto 18px}
.context{white-space:pre-wrap;line-height:1.85;color:#384c63;overflow-wrap:anywhere}
.work{display:grid;grid-template-columns:290px minmax(0,1fr);gap:16px;align-items:start}
.index{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;min-height:500px}
.indexhead{padding:16px;border-bottom:1px solid var(--line)}.indexhead input{width:100%;border:1px solid #d6e0ec;border-radius:7px;padding:9px 11px}
.indextitle{margin:13px 13px 5px;color:#8191a6;font-size:11px;letter-spacing:.5px}
.indexitem{display:flex;width:100%;text-align:left;border:0;background:white;border-bottom:1px solid #edf1f5;gap:8px;padding:12px;align-items:center;justify-content:space-between}.indexitem:hover{background:#f5f8fc}.indexitem.active{background:#eaf2fd;border-left:3px solid var(--blue);padding-left:9px}
.indexitem span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.detail{background:#fff;border:1px solid var(--line);border-radius:10px;min-height:500px}
.detailhead{padding:22px 24px;border-bottom:1px solid var(--line)}.detailhead h2{margin:8px 0;font-size:22px;line-height:1.4}
.detailbody{padding:23px 25px}.doc{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.9;color:#364960}.doc:empty:before{content:"尚未补充设计说明或依据";color:#9ba8b8}
.doc h2{font-size:19px;margin:26px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.doc h3{font-size:16px;margin:20px 0 9px}
.doc p{margin:10px 0;white-space:pre-wrap}
.doc ul{margin:9px 0;padding-left:22px}
.doc table{width:100%;border-collapse:collapse;font-size:12px;margin:15px 0}
.doc th,.doc td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.doc th{background:#f1f6fc}
.doc pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f6fa;border:1px solid var(--line);padding:14px;border-radius:7px}
.doc .blockquote{border-left:3px solid #b6d0f3;background:#f4f8ff;padding:10px 15px;color:#526882}
.breadcrumbs{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:9px 0;color:var(--quiet);font-size:12px}
.meta-table{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;margin:14px 0}.meta-cell{background:#f7f9fc;border:1px solid #edf0f4;border-radius:7px;padding:10px 13px;min-width:0}.meta-cell label{color:var(--quiet);font-size:11px;display:block}.meta-cell div{font-size:13px;overflow-wrap:anywhere}
.rule{border:0;border-top:1px solid var(--line);margin:24px 0}.detailsection{margin-top:22px}.detailsection h3{font-size:14px;margin:0 0 10px}
.relation{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}.relation .reltext{flex:1;font-size:12px;color:var(--soft)}.relation button{border:0;background:none;color:var(--blue);font-weight:600;text-align:left}
.timeline{display:grid;gap:10px}.event{padding:10px 0;border-bottom:1px solid var(--line)}.event strong{font-size:12px}.event small{color:var(--quiet);display:block}
.toolbar{display:flex;gap:9px;align-items:center;justify-content:space-between;margin:15px 0;flex-wrap:wrap}
.assess{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:12px 0}.assess strong{flex:1}.assess select{max-width:155px;padding:7px;border:1px solid var(--line);border-radius:6px}
.reason{padding:12px 14px;border:1px solid #eecb94;background:#fff9f0;border-radius:7px;color:#825c24;margin-bottom:8px}
.info{border:1px solid #d2e2f8;background:#f0f6ff;color:#4e6c8e;border-radius:8px;padding:13px 15px;font-size:12px;margin:14px 0}
.hist{border-top:1px solid var(--line);padding:12px 0}.hist summary{cursor:pointer;font-weight:600}.hist pre{background:#f6f8fb;padding:15px;overflow:auto;white-space:pre-wrap;word-break:break-word;font-size:12px}
.hidden{display:none!important}
.overlay{position:fixed;inset:0;background:rgba(19,39,64,.35);display:flex;align-items:center;justify-content:center;padding:18px;z-index:30}
.modal{background:#fff;border-radius:13px;width:min(740px,100%);max-height:93vh;overflow:auto;box-shadow:0 15px 60px #0b25402c}
.modalheader{padding:19px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.modalheader h2{font-size:18px;margin:0}.modalbody{padding:23px 24px}.modalfooter{padding:16px 24px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:flex-end;gap:9px}
.field{margin-bottom:15px}.field label{font-size:12px;font-weight:650;display:block;margin-bottom:6px}.field small{display:block;color:var(--quiet);font-size:11px;margin-top:4px}
.field input,.field textarea,.field select{width:100%;border:1px solid #cbd6e4;border-radius:7px;padding:10px 12px;background:#fff;color:var(--ink)}
.field textarea{min-height:125px;resize:vertical}.field .short{min-height:75px}.field .long{min-height:205px}
.error{color:#a9353c;background:#fff1f1;border:1px solid #f0c8ca;border-radius:7px;padding:12px;font-size:12px}
pre.readout{background:#f6f8fb;border:1px solid var(--line);border-radius:8px;padding:16px;max-height:56vh;overflow:auto;white-space:pre-wrap;font-size:12px;line-height:1.7}
.toast{position:fixed;bottom:22px;right:22px;background:#243c58;color:white;padding:12px 18px;border-radius:9px;box-shadow:0 8px 30px #1025392b;z-index:100;max-width:min(540px,85vw)}
@media(max-width:1190px){.work{grid-template-columns:235px minmax(0,1fr)}.fourcol{grid-template-columns:repeat(2,minmax(0,1fr))}.twocol{grid-template-columns:1fr}}
@media(max-width:800px){.app{display:block}.side{position:static;height:auto;padding:12px;gap:8px}.identity{padding:0 5px 9px}.sidefoot{display:none}.nav{grid-template-columns:repeat(3,minmax(0,1fr))}.nav button{font-size:12px;padding:8px 4px}.nav b{display:none}.main{padding:20px 14px}.work{display:block}.index{min-height:auto;margin-bottom:12px;max-height:270px;overflow:auto}.detail{min-height:300px}.detailbody{padding:18px}.threecol{grid-template-columns:1fr}.fourcol{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="app"><aside class="side">
  <div class="identity"><strong>Engineering<em>.</em></strong><small>研发工程与生命周期管理 · V0.8（治理候选）</small></div>
  <div class="projectpicker"><label for="projectSelect">当前产品 / 项目</label><select id="projectSelect"></select><div class="buttonrow" style="margin-top:9px"><button class="link" id="newProject">+ 新建项目</button><button class="link" id="editProject">编辑定义</button></div></div>
  <div class="sideheading" style="padding-left:12px">研发生命周期</div>
  <nav class="nav" id="nav">
    <button data-view="dashboard" class="active"><b>▦</b>项目驾驶舱</button>
    <button data-view="product"><b>◎</b>产品与系统</button>
    <button data-view="engineering"><b>⊞</b>需求与架构</button>
    <button data-view="research"><b>⌕</b>技术预研与实验</button>
    <button data-view="execution"><b>⇥</b>GitHub 与 AI 执行</button>
    <button data-view="management"><b>⌘</b>AI 项目管理与审批</button>
    <button data-view="governance"><b>⇄</b>决策与变更</button>
    <button data-view="delivery"><b>✓</b>实施与验证</button>
    <button data-view="archive"><b>▤</b>资料与归档</button>
    <button data-view="history"><b>◷</b>历史与配置</button>
  </nav>
  <div class="sidefoot"><span class="dot"></span>本机 · 单人 · 无账号<br>变更与审批均有修订记录<br>原始项目资料不被自动覆盖</div>
</aside>
<div class="main"><div class="topline"><span id="breadcrumb">工作区 / 项目驾驶舱</span><div class="top-actions"><span id="version" class="tiny"></span><button id="export" class="outline">导出项目备份</button></div></div><main id="content"></main></div></div>
<div class="overlay hidden" id="overlay"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modalheader"><h2 id="modalTitle"></h2><button id="modalClose" class="outline">关闭 ×</button></div><div id="modalBody" class="modalbody"></div><div class="modalfooter" id="modalFooter"></div></div></div>
<div id="toasts" aria-live="polite"></div>
<script>
'use strict';
const el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined&&text!==null)n.textContent=String(text);return n};
const add=(p,...children)=>{children.forEach(n=>p.append(n));return p};
const $=s=>document.querySelector(s);
const clean=n=>n.replaceChildren();
const kinds={context:'产品背景',capability:'产品能力',system:'系统/组件',requirement:'需求',architecture:'总体架构',interface:'接口契约',design:'详细设计',decision:'技术决策',change:'问题/变更',risk:'风险',work_package:'实施工作包',test:'测试/证据',milestone:'里程碑',reference:'历史资料'};
const stages={dashboard:'项目驾驶舱',product:'产品与系统',engineering:'需求与架构',research:'技术预研与实验',execution:'GitHub 与 AI 执行',management:'AI 项目管理与审批',governance:'决策与变更',delivery:'实施与验证',archive:'资料与归档',history:'历史与配置'};
const groupKinds={product:['context','capability','system'],engineering:['requirement','architecture','interface','design'],governance:['decision','change','risk'],delivery:['work_package','test','milestone'],archive:['reference']};
const statuses={DRAFT:'草稿',IN_REVIEW:'待审查',APPROVED:'已批准',SUPERSEDED:'已替代',OPEN:'待处理',CLOSED:'已关闭'};
const relationNames={derives:'来源/派生',allocated:'分配至',defines:'定义/约束',depends:'实施依赖',implements:'实现',verifies:'验证',impacts:'变更影响'};
const metaLabels={source:'信息来源',acceptance:'验收/判定标准',rationale:'设计依据',alternatives:'候选方案',conclusion:'决策结论',source_sha:'代码基线 SHA',file_scope:'可修改文件',input_revisions:'固定输入修订',result:'验证结果',evidence_level:'证据等级',severity:'风险等级',configuration:'适用配置',assessments:'影响评审结论',due:'目标日期'};
let state={token:'',projects:[],project:null,data:null,view:'dashboard',selected:null,filter:'',typeFilter:'all'};
const root=$('#content');
function button(label,cls,click){let b=el('button',cls,label);if(click)b.onclick=click;return b}
function note(msg){return el('div','info',msg)}
function badge(value){let s=el('span','badge',statuses[value]||value||'未定义');if(value==='APPROVED'||value==='PASS')s.classList.add('good');else if(value==='OPEN'||value==='IN_REVIEW'||value==='DRAFT'||value==='NOT_READY')s.classList.add('warn');else if(value==='FAIL')s.classList.add('bad');else s.classList.add('blue');return s}
function heading(title,desc){add(root,el('h1','page-title',title),el('p','intro',desc))}
function section(title){let s=el('section','section'),line=el('div','sectionline');line.append(el('h2','',title));s.append(line);root.append(s);return {node:s,header:line}}
function brief(text,n=180){return text&&text.trim()?text.trim().slice(0,n):'尚无详细说明'}
function projectName(){return state.data?.project?.name||''}
function item(id){return state.data?.objects.find(x=>x.id===id)}
function itemName(id){return item(id)?.title||'(工程对象已不存在)'}
function groupLabel(kind){return kinds[kind]||kind}
function toast(message){const node=el('div','toast',message);$('#toasts').append(node);setTimeout(()=>node.remove(),4500)}
async function req(url,data){const params={cache:'no-store'};if(data!==undefined){params.method='POST';params.headers={'Content-Type':'application/json','X-Local-Token':state.token};params.body=JSON.stringify(data)}
  let response=await fetch(url,params),payload=await response.json();if(!response.ok)throw Error(payload.error||'操作失败');return payload;}
function qs(x){return encodeURIComponent(x)}
async function boot(){const b=await req('/api/studio/bootstrap');state.token=b.csrf;state.projects=b.projects;let previous=localStorage.getItem('engineering-last-project');state.project=b.projects.some(x=>x.id===previous)?previous:b.projects[0]?.id||null;await refresh(false);navigate('dashboard')}
async function refresh(render=true){if(state.project){state.data=await req('/api/studio/project?id='+qs(state.project));localStorage.setItem('engineering-last-project',state.project)}else state.data=null;
  let picker=$('#projectSelect');clean(picker);if(!state.projects.length)picker.append(new Option('还没有项目',''));else state.projects.forEach(p=>picker.append(new Option(p.name,p.id)));
  picker.value=state.project||'';$('#editProject').disabled=!state.project;$('#export').disabled=!state.project;
  $('#version').textContent=state.data?('产品版本 '+(state.data.project.version||'未指定')):'本地工作区';
  if(render)renderView();}
function navigate(view){state.view=view;state.selected=null;state.filter='';state.typeFilter='all';document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));renderView()}
function renderView(){clean(root);$('#breadcrumb').textContent=(projectName()||'工程工作区')+' / '+stages[state.view];
 if(!state.data)return renderWelcome();
 if(state.view==='dashboard')return renderDashboard();
 if(state.view==='research')return renderResearchView();
 if(state.view==='execution')return renderExecutionView();
 if(state.view==='management')return renderManagementView();
 if(state.view==='history')return renderHistory();
 return renderEditor();}
function renderWelcome(){const box=el('div','blank');add(box,el('h2','','建立你的第一个工程项目'),el('p','','从产品背景、使用场景和系统边界开始，逐层建立需求、架构、接口、详细设计和实施验证。所有对象可以再次修订，不需要按固定 Gate 一次性走完。'),button('创建工程项目','primary',()=>projectModal()),button('从备份恢复项目','outline',restoreWorkspaceModal));root.append(box);
 const s=section('建立什么，而不只是记录什么');let grid=el('div','threecol');[['产品与系统','明确为何开发、产品版本、系统组成和能力边界'],['设计与决策','从需求到接口逐级展开，负责人审查并批准有效版本'],['反馈与验证','实施/实测发现问题时回到上层变更，再更新受影响工作包']].forEach(x=>{let c=el('div','panel');add(c,el('h2','',x[0]),el('p','',x[1]));grid.append(c)});s.node.append(grid);}
function rowCard(obj,act){let b=el('button','item-row');let left=el('div');add(left,el('div','rowtitle',obj.title),el('div','rowdesc',groupLabel(obj.kind)+' · '+brief(obj.body,130)));add(b,left,badge(obj.state));b.onclick=()=>act(obj);return b}
function stat(count,name,desc){let b=el('div','stat');add(b,el('b','',count),el('label','',name),el('small','',desc));return b}
function openItem(obj){let v=Object.keys(groupKinds).find(g=>groupKinds[g].includes(obj.kind));if(!v)return;state.view=v;state.selected=obj.id;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===v));renderView();}
function renderReadable(container,raw){
 const lines=(raw||'').split(/\r?\n/);let i=0, fence=String.fromCharCode(96).repeat(3);
 while(i<lines.length){const text=lines[i].trim();if(!text){i++;continue}
  if(text.startsWith(fence)){const code=[];i++;while(i<lines.length&&!lines[i].trim().startsWith(fence))code.push(lines[i++]);i++;container.append(el('pre','',code.join('\n')));continue;}
  let h=/^(#{1,5})\s+(.+)$/.exec(text);
  if(h){container.append(el(h[1].length<=2?'h2':'h3','',h[2].replace(/\*\*/g,'')));i++;continue;}
  if(text.startsWith('|')){let table=el('table'),first=true;
   while(i<lines.length&&lines[i].trim().startsWith('|')){
    let cells=lines[i].trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(v=>v.trim());
    i++;if(cells.every(v=>/^:?-{3,}:?$/.test(v)))continue;
    let row=el('tr');cells.forEach(v=>row.append(el(first?'th':'td','',v.replace(/\*\*/g,''))));table.append(row);first=false;
   }container.append(table);continue;}
  if(/^[-*] /.test(text)||/^\d+\. /.test(text)){let ul=el('ul');while(i<lines.length){let match=/^(?:[-*]|\d+\.)\s+(.+)$/.exec(lines[i].trim());if(!match)break;ul.append(el('li','',match[1].replace(/\*\*/g,'')));i++}container.append(ul);continue;}
  if(text.startsWith('>')){container.append(el('div','blockquote',text.replace(/^>\s*/,'')));i++;continue;}

 });}
function relationModal(selected){showModal('新增上下游工程关系',(body,footer)=>{
 body.append(note('关系方向是“来源对象 → 受影响或下游对象”。不要以文件或标题相似性代替真实的工程关系。'));
 const source=selectField(body,'起点（需求/设计/变更）',state.data.objects.map(x=>[x.id,x.title]),selected.id);
 const kind=selectField(body,'关系类型',Object.entries(relationNames),selected.kind==='change'?'impacts':'defines');
 const target=selectField(body,'终点（下游对象）',state.data.objects.filter(x=>x.id!==selected.id).map(x=>[x.id,x.title]));
 modalActions(footer,async()=>{await mutate('/api/studio/relation',{source_id:source.value,target_id:target.value,kind:kind.value});toast('关系已创建为候选，确认后才可作为正式实施依赖');},'建立关联');});}
async function transition(obj,action){if(action!=='submit')return;try{await mutate('/api/studio/object/'+obj.id+'/submit',{expected_revision:obj.revision});toast('已提交审查')}catch(e){toast(e.message)}}
function relationApprovalModal(rel){showModal('确认工程关系',(body,footer)=>{
 body.append(note('关系只有经负责人审查确认后，才可以作为编码准入的有效设计依赖。关系本身保留审批者和理由。'));
 body.append(el('p','',itemName(rel.source_id)+' → '+relationNames[rel.kind]+' → '+itemName(rel.target_id)));
 const actor=field(body,'关系审查人','项目负责人');
 const reason=field(body,'确认依据','','textarea');
 modalActions(footer,async()=>{await mutate('/api/studio/relation/approve',{id:rel.id,actor:actor.value,note:reason.value});toast('工程关系已确认');},'确认关系');
 });}
function approvalModal(obj,isClose=false){showModal(isClose?'关闭变更与评审':'审批工程对象',(body,footer)=>{
 body.append(note(isClose?'需要确认每条关联影响已完成评估，再明确关闭理由。':'审批只针对当前修订。实施、构建和物理验证仍需要分别留证。'));
 const actor=field(body,'作出决定的人','项目负责人');const reason=field(body,'决定依据、限制条件与理由','','textarea');
 modalActions(footer,async()=>{await mutate('/api/studio/object/'+obj.id+'/'+(isClose?'close':'approve'),
 {expected_revision:obj.revision,actor:actor.value,note:reason.value});toast(isClose?'变更已关闭':'该修订已批准并保留审批记录');},isClose?'确认关闭':'批准当前修订');
 });}
async function showReadiness(obj){try{const status=await req('/api/studio/readiness?id='+qs(obj.id));showModal('实施准入 · '+obj.title,(body,footer)=>{
  add(body,badge(status.ready?'READY_TO_CODE':'NOT_READY'));
  if(status.reasons.length)for(const why of status.reasons)body.append(el('div','reason',why));
  else body.append(note('已通过自动准入检查。正式实施仍需遵守适用项目的安全约束和版本控制。'));
  if(status.upstream.length){body.append(el('h3','','已关联的设计输入'));status.upstream.forEach(x=>body.append(el('p','',x.title+' / r'+x.revision+' / '+(statuses[x.state]||x.state))))}
  footer.append(button('关闭','outline',closeModal));});}catch(e){toast(e.message)}}
async function showContext(obj){try{const pack=await req('/api/studio/context?id='+qs(obj.id));showModal('AI 实施上下文 · 固定修订',(body,footer)=>{
 body.append(note('此上下文基于当前批准并固定的工程对象生成，不代替源码安全审查。'));body.append(el('pre','readout',pack.markdown));
 footer.append(button('复制文本','outline',()=>navigator.clipboard.writeText(pack.markdown).then(()=>toast('已复制上下文')).catch(()=>toast('复制受浏览器权限限制'))));
 footer.append(button('保存 Markdown','primary',()=>downloadFile(pack.markdown,'implementation-context.md','text/markdown')));});}catch(e){toast(e.message)}}
async function impactModal(selected){try{const result=await req('/api/studio/impact?id='+qs(selected.id));showModal('影响链分析 · '+selected.title,(body,footer)=>{
  body.append(note('这些是按显式工程关系传播的潜在受影响对象。每一条仍需人判断是否需要修订或继续实验。'));
  if(!result.affected.length)body.append(el('p','', '暂无下游关系'));
  for(const x of result.affected){const cell=el('div','event');add(cell,el('strong','',x.title+' · '+groupLabel(x.kind)),el('small','',x.trace.map(itemName).join(' → ')));body.append(cell);}
  footer.append(button('关闭','outline',closeModal));});}catch(e){toast(e.message)}}
async function historyModal(selected){try{const detail=await req('/api/studio/object?id='+qs(selected.id));showModal('修订与历史 · '+selected.title,(body,footer)=>{
 body.append(note('每次修改与批准都写入独立快照。旧版内容可以复查，不会被新的草稿覆盖。'));
 for(const h of detail.history){const d=el('details','hist');d.append(el('summary','','r'+h.revision+' · '+h.action+' · '+h.recorded_at+' · '+(h.actor||'')));let pre=el('pre','',h.title+'\n\n'+h.body+'\n\n'+JSON.stringify(h.meta,null,2));d.append(pre);body.append(d);}
 footer.append(button('关闭','outline',closeModal));});}catch(e){toast(e.message)}}
function downloadFile(text,filename,format){let blob=new Blob([text],{type:format||'application/json'});let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),600)}
async function exportProject(){if(!state.project)return;try{let data=await req('/api/studio/export?project='+qs(state.project));downloadFile(JSON.stringify(data,null,2),'engineering-project-'+state.data.project.name.replace(/[\\/:*?"<>|]/g,'_')+'.json','application/json');toast('已生成项目结构化备份，请妥善保存。')}catch(e){toast(e.message)}}
$('#projectSelect').onchange=async e=>{state.project=e.target.value;await refresh(false);navigate('dashboard')};
$('#newProject').onclick=()=>projectModal();$('#editProject').onclick=()=>state.data&&projectModal(state.data.project);
$('#export').onclick=exportProject;$('#modalClose').onclick=closeModal;$('#overlay').onclick=e=>{if(e.target===$('#overlay'))closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
document.querySelectorAll('[data-view]').forEach(n=>n.onclick=()=>navigate(n.dataset.view));
window.addEventListener('load',()=>boot().catch(e=>{clean(root);add(root,el('h1','','本地工作区未能启动'),note(e.message))}));
</script><script src="/research.js"></script><script src="/execution.js"></script><script src="/management.js"></script><script src="/capability.js"></script><script src="/change.js"></script><script src="/verification.js"></script><script src="/plan.js"></script><script src="/restore.js"></script><script src="/governance.js"></script><script src="/definition-research.js"></script><script src="/definition-suggestions.js"></script></body></html>
