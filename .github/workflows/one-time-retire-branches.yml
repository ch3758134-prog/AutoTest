name: One-time ref retirement (repository maintenance, not CI)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-retire-branches.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  retire-old-branches:
    if: github.repository == 'ch3758134-prog/AutoTest'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify archive object and create the single recovery tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_SHA: 8081921f18b593d0df2c6a3df3623246499032f2
          BASE_TREE_SHA: 8813132ddb3440a056a0d07c8b1ced638a3e2b61
          ARCHIVE_TAG: archive/retired-branches-20261111
        run: |
          set -euo pipefail
          object=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$ARCHIVE_SHA")
          echo "$object" | jq -e --arg sha "$BASE_TREE_SHA" '.tree.sha == $sha and (.parents | length) == 22' >/dev/null
          existing=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$ARCHIVE_TAG" --jq '.[] | select(.ref == "refs/tags/archive/retired-branches-20261111") | .object.sha' 2>/dev/null || true)
          if [[ -z "$existing" ]]; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$ARCHIVE_TAG" -f "sha=$ARCHIVE_SHA" >/dev/null
          elif [[ "$existing" != "$ARCHIVE_SHA" ]]; then
            echo 'Tag exists but does not point to the approved archive commit. Refusing deletion.' >&2
            exit 1
          fi
          actual=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$ARCHIVE_TAG" --jq '.[] | select(.ref == "refs/tags/archive/retired-branches-20261111") | .object.sha')
          [[ "$actual" == "$ARCHIVE_SHA" ]] || { echo 'Archive tag verification failed' >&2; exit 1; }
          echo "Verified tag $ARCHIVE_TAG -> $actual, all legacy heads reachable"
      - name: Delete only exact unchanged obsolete branch refs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          failed=0
          while read -r name expected; do
            [[ -z "$name" ]] && continue
            [[ "$name" != "main" ]] || { echo 'Guard: main is never a target' >&2; exit 1; }
            actual=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$name" --jq '.object.sha' 2>/dev/null || true)
            if [[ -z "$actual" ]]; then
              echo "Already removed: $name"
            elif [[ "$actual" != "$expected" ]]; then
              echo "SKIPPED changed branch: $name (actual=$actual, expected=$expected)" >&2
              failed=$((failed+1))
            else
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$name" >/dev/null
              echo "Deleted: $name ($expected)"
            fi
          done <<'BRANCHES'
          cleanup/main-remove-legacy-labs-20261112 b90c15b9f153ba526d11776304c1123071b02790
          feature/cantool-flash-lab-20261110 e5fcb64f81982652e8ab275c5d203b3091c31fed
          feature/r1-editor-layout-real-sample-20261111 3e8babbd9b89ad6bcc70768a6e691858b007d126
          feature/r1-full-product-ui-system-20261111 628a1a014573804a43f94796f4ede4b9742c3bb1
          feature/r1-html-product-ui-20261110 a8779a685b6f2c70aa4ff8d0aa0716bf14b76e9a
          feature/r1-ide-final-integration-20261112 915dcd33a5c9855e08e81fcfd827de39c01a82ae
          feature/r1-lightblue-ide-full-redesign-20261111 004ffbd4ade6189da07c589bc6c546b765d4eb0d
          feature/r1-manual-bench-action-editor-20261111 f178e78dc52ed445041c61f8dfc5c92593cccd3a
          feature/r1-test-editor-direct-connect-20261111 a82940b9ba30506ec0c52fcf38de403b29073488
          feature/r1-ui-sample-startup-overhaul-20261112 e75cf87835f5c01c7adcd0b37954e2d192c2022f
          feature/r1-unified-ide-shell-rebuild-20261111 d2bae009be566575e8df6220022702ab9158353c
          feature/r1-v6-selective-testcases-20261110 59867d5a52f2d58e1bd536c93d16c58b5a01d348
          feature/real-hardware-studio-20261109 45d5cce40c7cdc1c45f506e8e9b57d61f0ce71c3
          maintenance/archive-retire-legacy-20261109 162a6924436c4001d172517c63b46f108713c938
          management/evolutionary-lifecycle-pilot-20261109 f3859ffcb1e0bb52ed6f9a8aefaa01d1d5c141cf
          management/project-control-clean-20261111 76ae0185e199bbccc09e439980e037511ea714af
          management/project-control-portable-init-20261111 6ae2d087f41a9988071dc40d0021aeb20eb101ed
          management/project-control-rebuild-20261111 76622b8ab6974cd0a29126c30a7b2e2ad1de21fc
          management/project-control-redesign-20261111 7bc0aa27fd63cbcecba2c2da06e5ed1a948e1c49
          recovery/product-led-baseline-20261109 e006ec71168ab28c5228d2cee007026a3b81c103
          ui/foundation-gallery-20261109 2808bdd7c8c4b23c154cf9cb891cdaa900fdce8a
          BRANCHES
          if (( failed > 0 )); then
            echo "$failed branches changed; only those refs were preserved" >&2
            exit 1
          fi
          remaining=$(gh api "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name')
          printf 'Remaining branches:\n%s\n' "$remaining"
          [[ "$remaining" == 'main' ]] || { echo 'Unexpected branches remain' >&2; exit 1; }
          echo 'ONE_BRANCH_BASELINE_PASS'
