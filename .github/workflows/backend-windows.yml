name: Backend-only Windows validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-windows:
    name: Core modules and backend tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact ref
        uses: actions/checkout@v4
      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.400'
      - name: Record SDK and revision
        shell: pwsh
        run: |
          dotnet --info
          git rev-parse HEAD
      - name: Verify backend does not depend on WPF presentation
        shell: pwsh
        run: ./HOST/tools/verify-backend-boundaries.ps1
      - name: Restore backend solution only
        shell: pwsh
        run: dotnet restore HOST/AutoTest.Backend.slnf
      - name: Restore compile-negative test fixture without compiling it
        shell: pwsh
        run: dotnet restore HOST/tests/negative/StrongIdMisuse/StrongIdMisuse.csproj
      - name: Compile backend solution only
        shell: pwsh
        run: dotnet build HOST/AutoTest.Backend.slnf -c Release --no-restore --verbosity minimal
      - name: Run all backend tests independently and preserve failure evidence
        shell: pwsh
        run: |
          New-Item -Force -ItemType Directory -Path "$env:GITHUB_WORKSPACE/backend-test-results" | Out-Null
          $projects = @(
            'HOST/tests/AutoTest.Contracts.Tests/AutoTest.Contracts.Tests.csproj',
            'HOST/tests/AutoTest.Devices.Tests/AutoTest.Devices.Tests.csproj',
            'HOST/tests/AutoTest.Projects.Tests/AutoTest.Projects.Tests.csproj',
            'HOST/tests/AutoTest.Testing.Tests/AutoTest.Testing.Tests.csproj',
            'HOST/tests/AutoTest.Specialists.Tests/AutoTest.Specialists.Tests.csproj',
            'HOST/tests/AutoTest.Records.Tests/AutoTest.Records.Tests.csproj',
            'HOST/tests/AutoTest.Application.Tests/AutoTest.Application.Tests.csproj'
          )
          $failed = @()
          foreach ($project in $projects) {
            $name = (Split-Path -Leaf (Split-Path -Parent $project))
            Write-Host "::group::Testing $name"
            dotnet test $project -c Release --no-restore --no-build --verbosity normal --logger "trx;LogFileName=$name.trx" --results-directory "$env:GITHUB_WORKSPACE/backend-test-results"
            if ($LASTEXITCODE -ne 0) { $failed += $name }
            Write-Host "::endgroup::"
          }
          if ($failed.Count -gt 0) {
            Write-Host "FAILED BACKEND PROJECTS: $($failed -join ', ')"
            exit 1
          }
      - name: Preserve TRX evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend-test-results/
          if-no-files-found: warn
          retention-days: 30
