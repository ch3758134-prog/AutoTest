<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AutoTest · 工程生命周期工作台</title>
<style>
:root{color-scheme:dark;--bg:#0b111b;--surface:#121b29;--surface2:#182436;--edge:#263448;--text:#e3ecf9;--muted:#8da0bc;--brand:#70a9ff;--green:#7ad7b0;--amber:#f5c67a;--red:#ed9e9e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 "Segoe UI","Microsoft YaHei UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.layout{min-height:100vh;display:grid;grid-template-columns:230px minmax(400px,1fr) 315px}.sidebar{border-right:1px solid var(--edge);background:#0e1723;padding:24px 14px;display:flex;flex-direction:column;gap:18px}.logo{padding:0 12px 22px;border-bottom:1px solid var(--edge)}.logo .mark{font-weight:800;font-size:21px;letter-spacing:-.6px}.logo .sub{font-size:11px;letter-spacing:2.6px;color:var(--brand);margin-top:2px}.label{font-size:10px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin:6px 12px}.nav{display:grid;gap:7px}.nav button{text-align:left;border:1px solid transparent;border-radius:9px;color:#b1c3dd;background:transparent;padding:11px 13px}.nav button:hover{background:var(--surface2)}.nav button.active{background:#1b3150;color:#dcecff;border-color:#345581}.sidefoot{margin-top:auto;padding:14px 12px;border-top:1px solid var(--edge);color:var(--muted);font-size:12px}.statusdot{display:inline-block;width:7px;height:7px;background:var(--green);border-radius:50%;margin-right:8px}
.main{padding:26px 33px 60px;min-width:0}.top{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--edge);padding-bottom:19px;margin-bottom:24px;gap:14px}.crumb{color:var(--muted);font-size:12px}.topright{color:var(--muted);font-size:11px;letter-spacing:1px;white-space:nowrap}.title{font-size:27px;font-weight:710;letter-spacing:-.6px;margin:0}.subtitle{color:var(--muted);margin:6px 0 24px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}.metric{padding:18px;background:var(--surface);border:1px solid var(--edge);border-radius:10px}.metric .number{font-size:29px;font-weight:700;line-height:1.15;letter-spacing:-.7px}.metric .caption{color:var(--muted);margin-top:8px;font-size:12px}
.panel{border:1px solid var(--edge);border-radius:12px;background:var(--surface);overflow:hidden;margin-top:18px}.panelhead{padding:18px 20px;border-bottom:1px solid var(--edge);display:flex;gap:15px;align-items:center;justify-content:space-between}.panelhead h2{font-size:15px;margin:0}.panelbody{padding:18px 20px}.search{border:1px solid var(--edge);border-radius:8px;padding:8px 12px;background:#0e1723;color:var(--text);width:min(100%,270px)}.node{width:100%;padding:12px 6px;background:transparent;color:var(--text);border:none;border-bottom:1px solid #223044;text-align:left;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}.node:last-child{border-bottom:none}.node:hover{background:#1b2a40}.nodename{font-weight:620;overflow-wrap:anywhere}.nodemeta{font-size:11px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.chip{font-size:10px;letter-spacing:.2px;border:1px solid #3d526c;padding:3px 7px;border-radius:6px;color:#bacbe4;white-space:nowrap}.chip.green{border-color:#346f5a;color:var(--green)}.chip.amber{border-color:#876d3b;color:var(--amber)}.chip.red{border-color:#784a4a;color:var(--red)}.help{padding:14px 18px;border-left:2px solid var(--brand);background:#162437;border-radius:7px;color:#bdd0e9;font-size:12px;margin-top:14px}.inspector{border-left:1px solid var(--edge);background:#101927;padding:27px 22px;min-width:0}.inspector h2{font-size:14px;margin:0 0 15px}.inspector p{color:var(--muted);font-size:12px}.field{margin:15px 0}.field label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;display:block;margin-bottom:6px}.field span{overflow-wrap:anywhere;font-size:12px}.mono{font-family:Consolas,"Courier New",monospace;font-size:11px;line-height:1.7}.split{border-top:1px solid var(--edge);margin:18px 0}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.select{background:#0e1723;border:1px solid var(--edge);border-radius:7px;color:var(--text);padding:10px;max-width:100%}.notice{padding:13px 16px;border-radius:9px;border:1px solid #866235;background:#312716;color:#f3d4a4;margin:15px 0;font-size:12px}.pass{border-color:#276752;background:#132c27;color:#99e8ce}.failure{border-color:#87494b;background:#341d22;color:#f3b5b8}.empty{padding:20px;color:var(--muted);font-size:13px}.reason{padding:10px 0;border-bottom:1px solid var(--edge);color:#edd1b6}.reason:last-child{border-bottom:0}
@media(max-width:1200px){.layout{grid-template-columns:195px minmax(380px,1fr)}.inspector{grid-column:2;border-top:1px solid var(--edge);border-left:0}}@media(max-width:700px){.layout{display:block}.sidebar{padding:12px;gap:9px}.logo{padding:0 8px 8px}.nav{grid-template-columns:repeat(3,1fr)}.nav button{font-size:11px;padding:9px 7px}.sidefoot,.label{display:none}.main{padding:20px 15px}.metrics{grid-template-columns:repeat(3,1fr)}.metric{padding:12px}.metric .number{font-size:23px}.inspector{padding:18px}.topright{display:none}}
</style></head><body>
<div class="layout"><aside class="sidebar"><div class="logo"><div class="mark">AutoTest<span style="color:var(--brand)">.</span></div><div class="sub">ENGINEERING CONTROL</div></div><div class="label">Lifecycle workspace</div><nav class="nav"><button class="active" data-view="overview">▤　系统全貌</button><button data-view="impact">⑂　设计变更</button><button data-view="readiness">✓　实施准入</button></nav><div class="sidefoot"><span class="statusdot"></span>LOCAL · READ ONLY<div style="margin-top:6px">不自动批准 · 不操作设备</div></div></aside><main class="main"><div class="top"><div class="crumb">PRODUCT / AutoTest / 生命周期管理试点</div><div class="topright">V0.1 · SINGLE USER</div></div><div id="content"><h1 class="title">加载工程数据…</h1></div></main><aside class="inspector" id="inspector"><h2>工程对象</h2><p>从左侧列表选择一个需求、架构或实现对象，查看它的来源、版本与证据状态。</p></aside></div>
<script>
'use strict';
const $=x=>document.querySelector(x), el=(tag,cls,text)=>{const a=document.createElement(tag);if(cls)a.className=cls;if(text!==undefined)a.textContent=String(text);return a;};
const content=$('#content'), inspector=$('#inspector');let state=null,view='overview';
async function api(path){let r=await fetch(path,{cache:'no-store'}),j=await r.json();if(!r.ok)throw Error(j.error||'Unknown API error');return j;}
function wipe(node){node.replaceChildren();}function section(title,sub){content.append(el('h1','title',title));content.append(el('p','subtitle',sub));}
function panel(title){let p=el('div','panel'),h=el('div','panelhead'),t=el('h2','',title),b=el('div','panelbody');h.append(t);p.append(h,b);content.append(p);return {p,h,b};}
function chip(label){let c=el('span','chip',label||'UNKNOWN');if(/ANCHORED|ACCEPTED|PASS$|READY_TO_CODE|DOCUMENTED_PATH/.test(label))c.classList.add('green');if(/REVIEW|DRAFT|NOT_READY|UNVERIFIED|REPORTED/.test(label))c.classList.add('amber');if(/MISSING|FAIL|ERROR/.test(label))c.classList.add('red');return c;}
function metric(value,label){let m=el('div','metric');m.append(el('div','number',value),el('div','caption',label));return m;}
function notice(text,tone=''){let n=el('div','notice '+tone,text);content.append(n);}
function makeRow(n,detail){let b=el('button','node'),left=el('div');left.append(el('div','nodename',n.id),el('div','nodemeta',detail||n.path||n.kind));b.append(left,chip(n.source_state||n.status));b.addEventListener('click',()=>showInspector(n));return b;}
function field(k,v,mono=false){const d=el('div','field');d.append(el('label','',k),el('span',mono?'mono':'',v??'—'));inspector.append(d);}
function showInspector(n){wipe(inspector);inspector.append(el('h2','',n.id),chip(n.kind));field('源码 / 文档位置',n.path,true);field('文本锚点',n.anchor,true);field('工作产品状态',n.work_product_state);field('Gate 历史',n.gate_state);field('需求成熟度',n.maturity);field('本地内容 SHA-256',n.sha256,true);field('当前文件状态',n.source_state);if(n.description)field('说明',n.description);inspector.append(el('div','split'),el('p','','文件中存在文本锚点，不等于语义已经验证、设计已经获批或真实台架已验收。'));}
function overview(){wipe(content);section('产品工程全貌','以现有 SAEF、设计工件和源码为依据。设计、实现、验证分别管理。');const m=el('div','metrics');m.append(metric(state.nodes.length,'已纳入的工程对象'),metric(state.edges.length,'候选追踪关系'),metric(state.changes.filter(x=>x.status==='OPEN'||x.status==='UNDER_REVIEW').length,'未关闭的变更'));content.append(m);let box=panel('工程对象索引'),input=el('input','search');input.placeholder='搜索 ID、类型、路径';box.h.append(input);const list=el('div');box.b.append(list);function draw(){wipe(list);let term=input.value.toLowerCase();let ns=state.nodes.filter(n=>[n.id,n.kind,n.path,n.description].some(v=>String(v||'').toLowerCase().includes(term)));if(!ns.length)list.append(el('div','empty','无匹配对象'));else ns.forEach(n=>list.append(makeRow(n)));}input.addEventListener('input',draw);draw();notice('当前为 KEY_SIM 有限范围试点。来源锚点和历史 Gate 状态不意味着新需求已经批准，或真实输出已通过验收。');}
async function impact(){wipe(content);section('设计变更与影响分析','从实测或实现发现向上确认需求，再向下定位需要审查的设计、代码与验证。');let box=panel('选择触发对象'),select=el('select','select');state.nodes.forEach(n=>{const o=el('option','',n.id);o.value=n.id;select.append(o);});select.value='OBS-KEYSIM-20261109';box.b.append(select);const response=panel('潜在影响（人工复审）');async function draw(){try{let r=await api('/api/impact?node='+encodeURIComponent(select.value));wipe(response.b);response.b.append(el('p','nodemeta','来源：'+r.changed+' · 共 '+r.affected.length+' 个候选下游对象'));r.affected.forEach(a=>{const ref=state.nodes.find(n=>n.id===a.id);let node={...ref,status:a.status};let row=makeRow(node,a.trace.join(' → '));response.b.append(row);row.append(chip(a.trace_certainty));});showInspector(state.nodes.find(n=>n.id===select.value));}catch(e){wipe(response.b);response.b.append(el('p','',e.message));}}select.addEventListener('change',draw);await draw();notice('POTENTIALLY_IMPACTED 是影响排查队列，不代表所有下游设计均已失效。');}
async function readiness(){wipe(content);section('实施准入检查','进入正式编码前，检查上游设计版本、变更阻断、审批记录和验证合同。');let wps=state.nodes.filter(n=>n.kind==='work_package');let box=panel('实施工作包'),sel=el('select','select');wps.forEach(n=>{let o=el('option','',n.id);o.value=n.id;sel.append(o);});box.b.append(sel);let results=panel('准入判定');async function draw(){try{let d=await api('/api/readiness?package='+encodeURIComponent(sel.value));wipe(results.b);results.b.append(el('div','notice '+(d.status==='READY_TO_CODE'?'pass':'failure'),d.status==='READY_TO_CODE'?'READY_TO_CODE · 仍不包含物理操作授权':'NOT_READY · 暂不得生成正式编码上下文'));if(!d.reasons.length)results.b.append(el('div','empty','该工作包检查未发现阻断项，仍须遵守实际审批权威及物理安全门禁。'));d.reasons.forEach(r=>results.b.append(el('div','reason','• '+r)));results.b.append(el('div','help',d.note));showInspector(state.nodes.find(n=>n.id===sel.value));}catch(e){wipe(results.b);results.b.append(el('div','notice failure',e.message));}}sel.addEventListener('change',draw);await draw();}
async function change(viewName){view=viewName;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===viewName));try{if(!state)state=await api('/api/overview');({overview,impact,readiness}[viewName])();}catch(e){wipe(content);section('无法载入工程数据',e.message);}}
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>change(b.dataset.view)));change('overview');
</script></body></html>
