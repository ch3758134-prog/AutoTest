name: One-time firmware source import
on:
  push:
    branches: [Main_Control, Key_Sim]
    paths: ['.github/workflows/firmware-import.yml']
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target firmware branch
        uses: actions/checkout@v4
      - name: Verify archived source and commit extracted project
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          from hashlib import sha256
          import os, zipfile
          
          branch = os.environ['GITHUB_REF_NAME']
          config = {
              'Main_Control': ('FW-MAIN-Project.zip.part', 17529847, '34b7e11b7d5d0fbb7b2178070f52e41febd88c15033a215516084ca294900239', 'Project'),
              'Key_Sim': ('FW-KEY-WS.zip.part', 6025867, 'ce032e5063d09f7d4fdce9dd190a8284bbf02ecbbd0258936d8f48387603e93d', 'WS'),
          }
          if branch not in config:
              raise RuntimeError('Unexpected branch: '+branch)
          prefix, expected_size, expected_sha, root = config[branch]
          parts = sorted(Path('firmware/chunks').glob(prefix+'*'))
          if not parts:
              raise RuntimeError('No source archive parts for '+branch)
          tmp = Path('/tmp/autotest-firmware-input.zip')
          h = sha256()
          n = 0
          with tmp.open('wb') as dst:
              for part in parts:
                  with part.open('rb') as src:
                      while True:
                          block = src.read(1048576)
                          if not block:
                              break
                          h.update(block)
                          dst.write(block)
                          n += len(block)
          if n != expected_size or h.hexdigest() != expected_sha:
              raise RuntimeError('Archive verification failed: size='+str(n)+', sha256='+h.hexdigest())
          with zipfile.ZipFile(tmp) as zf:
              members = zf.infolist()
              for entry in members:
                  name=entry.filename.replace('\\','/')
                  pp=PurePosixPath(name)
                  if pp.is_absolute() or '..' in pp.parts or not (name == root or name.startswith(root+'/')):
                      raise RuntimeError('Unsafe/unexpected path in archive: '+repr(name))
              zf.extractall('.')
          if not Path(root).is_dir():
              raise RuntimeError('Expected source directory missing after extraction: '+root)
          print('VERIFIED_IMPORTED',branch,root,'members',len(members),'sha256',expected_sha)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r -q firmware/chunks
          git rm -q .github/workflows/firmware-import.yml
          if [ "${GITHUB_REF_NAME}" = "Main_Control" ]; then git add -f -A -- Project; else git add -f -A -- WS; fi
          git add -A
          git commit -m "import(firmware): extract verified source project [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
