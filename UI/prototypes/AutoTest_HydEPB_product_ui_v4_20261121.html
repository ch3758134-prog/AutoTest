 document.querySelector('.modal-backdrop')?.remove();const backdrop=document.createElement('div');backdrop.className='modal-backdrop';backdrop.innerHTML=`<div class="modal"><h2>${esc(title)}</h2><p>${esc(description)}</p><input id="modal-value" value="${esc(defaultValue)}"/><div class="modal-actions"><button class="small-btn" id="modal-cancel">取消</button><button class="small-btn primary" id="modal-ok">确认</button></div></div>`;document.body.appendChild(backdrop);
 const input=backdrop.querySelector('#modal-value');input.select();input.focus();const finish=(ok)=>{if(ok){const v=input.value.trim();if(!v){toast('请输入名称');return;}callback(v);}backdrop.remove();};backdrop.querySelector('#modal-ok').onclick=()=>finish(true);backdrop.querySelector('#modal-cancel').onclick=()=>finish(false);input.addEventListener('keydown',e=>{if(e.key==='Enter')finish(true);if(e.key==='Escape')finish(false);});
}
function addCase(){modal('新建测试用例','创建后立即显示在工程树和编辑器，右侧可以配置。','新建测试用例',(name)=>mutate(()=>{let c={id:makeId(),name,enabled:true,runSelected:false,steps:[]};state.cases.push(c);activeCase=c.id;activeStep=null;openedTabs.push(c.id);activeTab=c.id;activeView='test';activeMode='edit';}));}
function selectCase(id){if(!state.cases.some(c=>c.id===id))return;activeCase=id;activeStep=null;activeView='test';activeTab=id;if(!openedTabs.includes(id))openedTabs.push(id);render();}
function selectStep(id){activeStep=id;renderTest();renderInspector();}
function catOf(type){return stepCatalog.find(x=>x.key===type)||{key:type,label:type,icon:'·'};}
function summary(s){const p=s.params||{};switch(s.type){case'can':return `${p.id||'未设置 ID'} · ${p.data||'00'} · ${p.mode||'单次'}${p.mode==='周期'?' '+(p.period||'')+'ms':''}`;case'key':return `20 Key · ${p.keys?.map(k=>'K'+k).join('/')||'未选择'} · ${p.hold||'未指定'} ms`;case'assert':return `${p.dbc||'未关联 DBC'}.${p.signal||'未选择'} ${p.op||'=='} ${p.expected||'—'} · ${p.timeout||''}ms`;case'wait':return `${p.ms||'0'} ms`;case'if':return p.expr||'未填写条件';case'loop':return `${p.count||'2'} 次`;case'var':return `${p.var||'变量'} = ${p.value??''}`;case'uds':return `${p.payload||'未配置'} · 请求 ${p.reqid||'—'}`;case'waveJudge':return `参考 ${p.reference||'未选择'} · 容差 ${p.tolerance||'—'}`;case'ign':case'fixture':return `目标 ${p.state||'未配置'} · 操作尚未发送`;case'flash':return p.profile||'未绑定烧录配置';case'flow':return p.flow||'未绑定公共流程';default:return Object.values(p).filter(v=>typeof v==='string').slice(0,2).join(' · ')||'点击右侧设置';}}
function resource(s){const p=s.params||{};switch(s.type){case'can':case'assert':return p.dbc||'未关联 DBC';case'wave':case'waveJudge':return p.reference||'参考波形未选';case'flow':return p.flow||'未绑定';case'flash':return p.profile||'未绑定';case'key':case'ign':case'fixture':return '台架 / IO';case'uds':return '诊断配置';default:return '—';}}
function problems(){const issues=[];for(const c of state.cases){for(const s of c.steps){if(!s.enabled)continue;if(s.type==='can'&&!/^0x[0-9a-f]+$/i.test(s.params.id||''))issues.push({case:c.name,step:s.name,msg:'CAN ID 格式需要确认',severity:'error'});if(s.type==='assert'&&(!s.params.dbc||!s.params.signal))issues.push({case:c.name,step:s.name,msg:'缺少 DBC 报文或信号引用',severity:'error'});if(s.type==='key'&&!s.params.keys?.length)issues.push({case:c.name,step:s.name,msg:'尚未选择 20 Key 组合',severity:'warn'});if(s.type==='waveJudge'&&(s.params.reference==='未指定'||!s.params.reference))issues.push({case:c.name,step:s.name,msg:'缺少参考波形和有效采样证据',severity:'warn'});}}
return issues;}

if(sidebarMode==='cases'){

content+=`<div class="tree-heading">快捷入口</div><div class="tree-item" data-tree-action="new-case"><span class="mark">＋</span>新建测试用例</div><div class="tree-item" data-tree-action="new-flow"><span class="mark">＋</span>新建公共流程</div>`;

}else{content='<div class="tree-heading">资源与引用</div>';for(let m of state.dbc.messages)content+=`<div class="tree-item" data-resource="dbc"><span class="mark">▧</span><span class="name">${esc(m.name)}</span></div>`;content+=`<div class="tree-item" data-resource="wave"><span class="mark">∿</span>波形资源</div><div class="tree-item" data-resource="uds"><span class="mark">U</span>诊断配置</div>`;}
area.innerHTML=content;
area.querySelectorAll('[data-case]').forEach(e=>e.addEventListener('click',ev=>{if(ev.target.closest('[data-run-case]'))return;selectCase(e.dataset.case)}));
area.querySelectorAll('[data-run-case]').forEach(e=>e.addEventListener('change',ev=>{ev.stopPropagation();const id=e.dataset.runCase;mutate(()=>{const c=state.cases.find(x=>x.id===id);if(c)c.runSelected=e.checked;});}));
area.querySelectorAll('[data-tree-action]').forEach(e=>e.addEventListener('click',()=>e.dataset.treeAction==='new-case'?addCase():newFlow()));
area.querySelectorAll('[data-flow]').forEach(e=>e.addEventListener('click',()=>{activeView='files';render();toast('公共流程资源已定位，可进入资源管理编辑') }));
area.querySelectorAll('[data-file]').forEach(e=>e.addEventListener('click',()=>{activeView='files';render();}));
area.querySelectorAll('[data-resource]').forEach(e=>e.addEventListener('click',()=>openTool(e.dataset.resource==='dbc'?'dbc':e.dataset.resource==='wave'?'wave':'uds')));
$('project-overview').innerHTML=`名称：${esc(state.name)}<br/>用例：${state.cases.length} 个　公共流程：${state.flows.length} 个<br/>DBC：${state.dbc.messages.length} 条报文<br/>版本：${esc(state.revision)}`;
}
function renderTabs(){let html=openedTabs.filter(id=>state.cases.some(c=>c.id===id)).map(id=>{const c=state.cases.find(x=>x.id===id);return `<button class="doc-tab ${activeView==='test'&&id===activeTab?'active':''}" data-tab="${id}">▤ ${esc(c.name)}<span class="close" data-close-tab="${id}">×</span></button>`;}).join('');if(activeView==='files')html+=`<button class="doc-tab active">▦ 工程与文件</button>`;if(activeView==='production')html+=`<button class="doc-tab active">▣ 生产与记录</button>`;$('document-tabs').innerHTML=html;$('document-tabs').querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',e=>{if(e.target.closest('[data-close-tab]'))return;selectCase(b.dataset.tab);}));$('document-tabs').querySelectorAll('[data-close-tab]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();openedTabs=openedTabs.filter(x=>x!==b.dataset.closeTab);if(activeTab===b.dataset.closeTab){activeTab=openedTabs.at(-1)||null;if(activeTab)activeCase=activeTab;else activeView='files';}render();}));}

if(activeMode==='run'){renderRun();return;}
const q=$('case-search').value;area.innerHTML=`<section class="page-section">

<div class="case-controls"><div class="segmented"><button class="active" data-set-mode="edit">编辑步骤</button><button data-set-mode="run">运行与调试</button></div><div class="search-mini">⌕ <input id="step-search" placeholder="搜索步骤，只高亮不破坏树" value="${esc(window.__stepQuery||'')}"/></div><button class="small-btn primary" id="add-step-btn">＋ 添加步骤</button><button class="small-btn" id="duplicate-step-btn">复制</button><button class="small-btn" id="toggle-step-btn">启用 / 禁用</button><button class="small-btn" id="step-check-btn">检查问题</button></div>
<div class="steps-head"><span>#</span><span>步骤 / 流程结构</span><span>关键参数 / 摘要</span><span>资源</span><span>状态</span></div><div class="steps-scroll" id="steps-scroll"></div></section>`;
const list=$('steps-scroll');let h='';const search=(window.__stepQuery||'').trim().toLowerCase();for(let phase of PHASES){const sub=c.steps.filter(x=>x.phase===phase);h+=`<div class="phase-band ${phase==='测试'?'test':phase==='清理'?'cleanup':''}" data-phase="${phase}"><span class="phase-dot"></span><span>⌄</span>${phase}<span class="count">${sub.length} 步</span><button data-phase-add="${phase}">＋ 添加步骤</button></div>`;if(!collapsed.has(phase))sub.forEach((s,n)=>{const m=!!search&&(s.name+' '+summary(s)).toLowerCase().includes(search);const cat=catOf(s.type);h+=`<div class="step-row ${s.id===activeStep?'selected':''} ${!s.enabled?'disabled-row':''} ${m?'match':''}" data-step="${s.id}" style="--depth:${s.depth||0}"><span class="step-index">${String(n+1).padStart(2,'0')}</span><span class="step-name" style="padding-left:${Math.min(3,s.depth||0)*18}px"><span class="step-glyph ${s.type}">${cat.icon}</span><span class="step-label">${s.slot?`<span class="tag" style="flex:none">${esc(s.slot.toUpperCase())}</span>`:''}${esc(s.name)}</span>${s.breakpoint?'<span class="breakmark" title="断点">●</span>':''}</span><span class="step-summary">${esc(summary(s))}</span><span class="step-resource">${esc(resource(s))}</span><span class="step-state ${!s.enabled?'off':s.breakpoint?'breakpoint':''}">${s.enabled?'待预检':'已禁用'}</span></div>`;});}
list.innerHTML=h;

Profile)}" placeholder="尚未指定"/></div><div class="prod-readiness">发布检查：${c.flashPolicy==='必须烧录'&&(!c.firmware||!c.flashProfile)?'缺少固件发布或烧录方案；': '缺少正式发布审核与资源指纹；'}当前 HTML 不具备实体生产授权。</div><div class="prod-actions"><button class="small-btn primary" id="prod-save-draft">保存草稿</button><button class="small-btn" disabled>发布生产方案</button></div></section></div>`;

 if(productionPage==='station'){

 };
 p.querySelector('#production-parse').onclick=check;p.querySelector('#production-scan-input').onkeydown=e=>{if(e.key==='Enter')check();};p.querySelector('#prod-edit-plan').onclick=()=>{productionPage='config';renderProduction();};
 p.querySelector('#prod-plan-check')?.addEventListener('click',()=>{productionLast.check=['方案尚未发布：不能进入生产执行','主控 USB 未连接，ECU 实体与速率未核对',...(c.flashPolicy==='必须烧录'?['Flash 资源/软件发布、唯一 TEST Flash 步骤、单次擦写授权均需审核']:[]),'没有正式记录链与出厂放行批准'];renderProduction();});
 }else if(productionPage==='config'){
 p.querySelector('#prod-save-draft').onclick=save;p.querySelector('#prod-open-test').onclick=()=>{activeView='test';render();};p.querySelector('#prod-open-flash').onclick=()=>openTool('flash');
 }else if(productionPage==='scanner'){
 const check=()=>{const inp=p.querySelector('#scanner-raw'),raw=inp.value.trim();if(!raw)return;const result=barcodeDetails(raw);scannerLast={valid:result.ok,raw,time:new Date().toLocaleString('zh-CN',{hour12:false}),result:result.ok?`${result.serial} · ${result.product}/${result.hardware} · CRC 正确`:result.reason};renderProduction();};
 p.querySelector('#scanner-raw-test').onclick=check;p.querySelector('#scanner-raw').onkeydown=e=>{if(e.key==='Enter')check();};p.querySelector('#scanner-use-test-vector').onclick=()=>{p.querySelector('#scanner-raw').value='UT1-EPBA-H02-000000123456-4372';p.querySelector('#scanner-raw').focus();};
 }

function renderBottom(){const box=$('bottom-content');$('bottom-panel').classList.toggle('collapsed',bottomCollapsed);document.querySelectorAll('[data-bottom]').forEach(b=>b.classList.toggle('active',b.dataset.bottom===bottomMode));const issues=problems();$('problems-count').textContent=issues.length;
if(bottomMode==='problems'){box.innerHTML=issues.length?issues.map(x=>`<div class="bottom-row issue ${x.severity}">⚠ ${esc(x.case)} / ${esc(x.step)}：${esc(x.msg)}</div>`).join(''):'<div class="bottom-row">无配置错误</div>';}
if(bottomMode==='timeline')box.innerHTML=window.__preflight?.issues?.length?`<div class="bottom-row">最近一次操作：${esc(window.__preflight.checkedAt)}</div><div class="bottom-row">范围：${esc(window.__preflight.scope)} · 未运行</div>`:'<div class="bottom-row">尚无真实 TEST 执行事件。步骤只有配置状态，不显示虚假的 PASS / FAIL。</div>';
if(bottomMode==='can')box.innerHTML='<div class="bottom-row">暂无 CAN 事件</div>';
if(bottomMode==='variables')box.innerHTML=(currentCase()?.steps.filter(x=>x.type==='var').map(x=>`<div class="bottom-row">${esc(x.params.var||'变量')} · 配置表达式 ${esc(x.params.value||'')} · 运行值：未获取</div>`).join(''))||'<div class="bottom-row">没有实际运行期变量观测。</div>';
}
function newFlow(){modal('新建公共流程','公共流程是单一连续步骤树，可被用例调用。','新的公共流程',name=>mutate(()=>state.flows.push({id:makeId(),name,revision:1,steps:[]})));}
function render(){document.getElementById('app').classList.toggle('production-mode',activeView==='production');document.querySelectorAll('[data-workspace]').forEach(b=>b.classList.toggle('selected',b.dataset.workspace===activeView));document.querySelectorAll('[data-side]').forEach(b=>b.classList.toggle('selected',b.dataset.side===sidebarMode));$('current-project-label').textContent=state.name;renderTree();renderTabs();if(activeView==='test')renderTest();else if(activeView==='files')renderFiles();else renderProduction();renderInspector();renderBottom();}
function exportProject(){const data=JSON.stringify(state,null,2),blob=new Blob([data],{type:'application/json'}),url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='绿通_HydEPB_工作区.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('工程数据已导出');}
function save(){persist();toast('已保存到本机浏览器');status('已保存');}
function openTool(type){if(typeof window.buildToolWindow!=='function'){toast('工具组件尚未加载');return;}window.buildToolWindow(type,windows);}
function openMenu(name,anchor){let data={file:[['创建测试用例','new-case'],['新建公共流程','new-flow'],['导出工程数据','export'],['导入工程数据','import'],['恢复初始工程','reset']],edit:[['撤销 Ctrl+Z','undo'],['重做 Ctrl+Y','redo'],['复制当前步骤','duplicate'],['删除当前步骤','delete']],view:[['自动测试','test'],['工程与文件','files'],['生产任务','production'],['折叠 / 展开下方观察区','bottom']],run:[['编辑当前用例','edit'],['运行与调试视图','debug'],['检查当前用例配置','preflight']],tools:[['DBC 编辑器','dbc'],['UDS 调试','uds'],['ECU 烧录','flash'],['波形分析','wave'],['手动台架','bench']],help:[['关于 AutoTest','help']]};let pop=$('menu-popover');if(!pop.classList.contains('hidden')&&pop.dataset.menu===name){pop.classList.add('hidden');return;}pop.dataset.menu=name;const rect=anchor.getBoundingClientRect();pop.style.left=Math.min(rect.left,innerWidth-260)+'px';pop.innerHTML=data[name].map(([label,key])=>`<button data-action="${key}">${esc(label)}</button>`).join('');pop.classList.remove('hidden');pop.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{pop.classList.add('hidden');const key=b.dataset.action;if(['dbc','uds','flash','wave','bench'].includes(key))openTool(key);else if(key==='new-case')addCase();else if(key==='new-flow')newFlow();else if(key==='export')exportProject();else if(key==='import')$('project-import').click();else if(key==='undo')history(false);else if(key==='redo')history(true);else if(key==='duplicate')duplicateStep();else if(key==='delete')stepAction('delete');else if(key==='bottom'){bottomCollapsed=!bottomCollapsed;renderBottom();}else if(key==='edit'){activeView='test';activeMode='edit';render();}else if(key==='debug'){activeView='test';activeMode='run';render();}else if(key==='preflight')preflight('case');else if(key==='help')modal('关于 AutoTest','AutoTest 通过工程资源组织测试步骤、工具配置与执行记录。','AutoTest',()=>{});else if(key==='reset')modal('恢复初始工程','输入“恢复”确认覆盖本机工作区改动','',v=>{if(v!=='恢复')return toast('未恢复');state=sample();activeCase='tc02';activeStep=state.cases[1].steps[1].id;undo=[];redo=[];persist();render();});else{activeView=key;render();}});}
// Global interactions
$('save-btn').onclick=save;$('undo-btn').onclick=()=>history(false);$('redo-btn').onclick=()=>history(true);$('top-add-step').onclick=()=>{activeView='test';activeMode='edit';render();openPalette(currentStep()?.phase||'测试');};$('new-case-mini').onclick=addCase;
$('case-search').oninput=renderTree;document.querySelectorAll('[data-workspace]').forEach(x=>x.onclick=()=>{activeView=x.dataset.workspace;render();});document.querySelectorAll('[data-side]').forEach(x=>x.onclick=()=>{sidebarMode=x.dataset.side;renderTree();});document.querySelectorAll('[data-menu]').forEach(x=>x.onclick=()=>openMenu(x.dataset.menu,x));
for(const key of ['bench','dbc','uds','flash','wave'])$('tool-'+key).onclick=()=>openTool(key);
$('palette-close').onclick=closePalette;$('palette-search').oninput=e=>fillPalette(e.target.value);document.querySelectorAll('[data-bottom]').forEach(b=>b.onclick=()=>{bottomMode=b.dataset.bottom;bottomCollapsed=false;renderBottom();});$('bottom-toggle').onclick=()=>{bottomCollapsed=!bottomCollapsed;renderBottom();};$('inspector-info').onclick=()=>toast('右侧参数始终对应当前所选步骤；不另开编辑对话框。');
$('project-import').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{const x=JSON.parse(await file.text());if(x.schema!=='autotest-ui-review-v2'||!Array.isArray(x.cases))throw Error('工程文件格式不匹配');mutate(()=>{state=x;activeCase=x.cases[0]?.id;activeStep=null;openedTabs=[activeCase];activeTab=activeCase;});toast('工程数据已导入');}catch(err){toast('导入失败：'+err.message);}e.target.value='';};
window.addEventListener('keydown',e=>{const tag=e.target?.tagName?.toLowerCase();const editing=['input','textarea','select'].includes(tag);if(e.key==='Escape'){closePalette();$('menu-popover').classList.add('hidden');return;}if(e.ctrlKey&&e.key.toLowerCase()==='s'){e.preventDefault();save();}else if(e.ctrlKey&&e.key.toLowerCase()==='z'&&!editing){e.preventDefault();history(false);}else if(e.ctrlKey&&e.key.toLowerCase()==='y'&&!editing){e.preventDefault();history(true);}else if(e.ctrlKey&&e.code==='Space'&&!editing){e.preventDefault();openPalette();}else if(e.key==='F9'&&!editing&&currentStep()){e.preventDefault();mutate(()=>currentStep().breakpoint=!currentStep().breakpoint);}});
window.addEventListener('beforeunload',()=>{for(const w of windows.values()){try{if(!w.closed)w.close();}catch(_){}}});
window.reviewApp={get state(){return state;},get case(){return currentCase();},mutate,persist,render,toast,modal,esc,makeId,openTool,save,windows};
render();
})();

<script>(() => {
'use strict';
const app=window.reviewApp;
const E=app.esc;
const meta={dbc:['DBC 编辑器','直接新建、批量编辑报文和信号，不以导入为前提'],uds:['UDS 调试','服务序列编辑与请求/响应上下文，不虚构 ECU 应答'],flash:['ECU 烧录','配置、阶段进度与 CAN 报文'],wave:['波形分析','导入真实 CSV、参考与测量叠加、缩放与游标'],bench:['手动台架','20 Key、IGN、夹具、多个 CAN 发送任务及右侧监视']};
const field=(label,key,value='',type='text',extra='')=>`<div class="field"><label>${label}</label><input type="${type}" data-field="${key}" value="${E(value)}" ${extra}/></div>`;
const pick=(label,key,choices,selected)=>`<div class="field"><label>${label}</label><select data-field="${key}">${choices.map(x=>`<option ${x===selected?'selected':''}>${E(x)}</option>`).join('')}</select></div>`;
const button=(label,action,style='')=>`<button class="small-btn ${style}" data-action="${action}">${label}</button>`;
const get=(w)=>w._review;
function toolPrompt(w,title,description,defaultValue,onConfirm){
 const doc=w.document;
 doc.querySelector('.tool-dialog')?.remove();
 const overlay=doc.createElement('div');overlay.className='modal-backdrop tool-dialog';
 overlay.innerHTML=`<div class="modal"><h2>${E(title)}</h2><p>${E(description)}</p><input id="tool-dialog-value" value="${E(defaultValue)}"/><div class="modal-actions"><button class="small-btn" data-cancel>取消</button><button class="small-btn primary" data-confirm>确认</button></div></div>`;
 doc.body.appendChild(overlay);
 const input=overlay.querySelector('#tool-dialog-value');input.select();input.focus();
 function finish(confirm){if(confirm){const name=input.value.trim();if(!name){app.toast('名称不能为空');return;}onConfirm(name);}overlay.remove();}
 overlay.querySelector('[data-cancel]').onclick=()=>finish(false);
 overlay.querySelector('[data-confirm]').onclick=()=>finish(true);
 input.addEventListener('keydown',e=>{if(e.key==='Enter')finish(true);if(e.key==='Escape')finish(false);});
}
function buildToolWindow(type,opened){
 if(!meta[type])return;
 let w=opened.get(type);
 if(w&&!w.closed){w.focus();return;}
 w=window.open('','AutoTestTool_'+type,'width=1540,height=900,resizable=yes,scrollbars=yes');
 if(!w){app.toast('浏览器阻止了新窗口，请允许弹窗后重试。');return;}
 opened.set(type,w);
 const styleUrl=window.__reviewStylesUrl||new URL('styles.css',location.href).href;
 w.document.open();w.document.write(`<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"/><title>AutoTest · ${meta[type][0]}</title><link rel="stylesheet" href="${styleUrl}"></head><body><div id="tool-root"></div></body></html>`);w.document.close();
 w._review={type,selectedMessage:app.state.dbc.messages[0]?.id,selectedSignal:null,selectedUds:app.state.uds.steps[0]?.id,selectedCan:app.state.bench.can[0]?.id,selectedKey:app.state.bench.keyActions[0]?.id,view:'edit',refSamples:[],actualSamples:[],zoom:1,cursorA:null,cursorB:null,preflight:[],inspectionMode:'none'};
 w._ownerRef=window;const ownerWatcher=w.setInterval(()=>{try{if(!w._ownerRef||w._ownerRef.closed){w.clearInterval(ownerWatcher);w.close();}}catch(_){w.clearInterval(ownerWatcher);w.close();}},250);
 w.addEventListener('beforeunload',()=>{w.clearInterval(ownerWatcher);opened.delete(type);});
 w.document.addEventListener('keydown',ev=>{if(ev.ctrlKey&&ev.key.toLowerCase()==='s'){ev.preventDefault();app.save();}});
 renderTool(w);
}
function renderTool(w){if(w.closed)return;const k=get(w).type,m=meta[k];const root=w.document.getElementById('tool-root');
 root.innerHTML=`<div class="tool-window"><header class="tool-titlebar"><div class="brand-icon">AT</div><div><div class="tool-title">${m[0]}</div></div><span class="top-spacer"></span>${button('保存','save','primary')}</header><section class="tool-body" id="tool-screen"></section><footer class="tool-bottom">USB 未连接</footer></div>`;
 const panel=w.document.getElementById('tool-screen');
 if(k==='dbc')renderDbc(w,panel);if(k==='uds')renderUds(w,panel);if(k==='flash')renderFlash(w,panel);if(k==='wave')renderWave(w,panel);if(k==='bench')renderBench(w,panel);

  const act=b.keyActions.find(x=>x.id===el.dataset.keyRun);if(!act)return;
  ux.selectedKey=act.id;
  ux.lastKeyAttempt={name:act.name,detail:formatKeys(act.keys)+' · '+act.hold+' ms'};
  app.toast('USB 未连接，按键动作未发送');renderTool(w);
 });
 c.querySelectorAll('[data-key-edit]').forEach(el=>el.onclick=()=>{ux.selectedKey=el.dataset.keyEdit;openBenchKeyDialog(w,el.dataset.keyEdit)});
 c.querySelectorAll('[data-key-more]').forEach(el=>el.onclick=e=>{openBenchActionMenu(w,el.dataset.keyMore,e.clientX,e.clientY)});
 c.querySelectorAll('[data-action]').forEach(el=>el.onclick=()=>{let a=el.dataset.action;
  if(a==='bench-key-add')openBenchKeyDialog(w,null);
  else if(a==='bench-ign')update(w,()=>b.ign=b.ign==='关'?'开':'关');
  else if(a==='bench-fixture')update(w,()=>b.fixture=b.fixture==='释放'?'压紧':'释放');
  else if(a==='bench-add-can')update(w,()=>{const x={id:app.makeId(),name:'新建 CAN 报文',canid:'0x000',dlc:8,data:'00 00 00 00 00 00 00 00',mode:'单次',period:1000,enabled:false};b.can.push(x);ux.selectedCan=x.id});
  else if(a==='bench-remove-can'&&current)update(w,()=>{b.can=b.can.filter(x=>x.id!==current.id);ux.selectedCan=b.can[0]?.id});
  else if(a==='bench-dbc')app.openTool('dbc');
  else if(a==='bench-copy-can'&&current){const copied=raw(current);try{w.navigator.clipboard.writeText(copied).then(()=>app.toast('已复制完整 DATA')).catch(()=>app.toast('当前浏览器不允许自动复制'));}catch(_){app.toast('当前浏览器不允许自动复制')}}
  else if(a==='bench-send-can'&&current){ux.lastCanAttempt=(current.mode==='周期'?'周期发送未启动':'单次发送未执行')+' · USB 未连接';app.toast(ux.lastCanAttempt);renderTool(w);}
  else if(a==='bench-stop-can'&&current){ux.lastCanAttempt='当前无已启动周期任务';app.toast(ux.lastCanAttempt);renderTool(w);}
 });
}
function openBenchActionMenu(w,id,x,y){
 const b=app.state.bench,act=b.keyActions.find(a=>a.id===id);if(!act)return;
 w.document.querySelector('.action-popup')?.remove();
 const menu=w.document.createElement('div');menu.className='action-popup';menu.style.left=Math.max(8,Math.min(x,w.innerWidth-165))+'px';menu.style.top=Math.max(8,Math.min(y,w.innerHeight-195))+'px';
 menu.innerHTML='<button data-kact="edit">编辑按键</button><button data-kact="rename">重命名</button><button data-kact="copy">复制</button><button data-kact="delete">删除</button>';
 w.document.body.appendChild(menu);
 const close=()=>menu.remove();
 menu.querySelectorAll('button').forEach(btn=>btn.onclick=()=>{const action=btn.dataset.kact;close();
  if(action==='edit')openBenchKeyDialog(w,id);
  if(action==='rename')toolPrompt(w,'重命名动作','',act.name||'按键动作',name=>update(w,()=>act.name=name));
  if(action==='copy')update(w,()=>{const newAct={...act,id:app.makeId(),name:(act.name||'按键动作')+' 副本',keys:[...act.keys]};b.keyActions.splice(b.keyActions.indexOf(act)+1,0,newAct);w._review.selectedKey=newAct.id});
  if(action==='delete')update(w,()=>{b.keyActions=b.keyActions.filter(a=>a.id!==id);w._review.selectedKey=b.keyActions[0]?.id});
 });
 setTimeout(()=>w.document.addEventListener('click',function dismiss(e){if(!menu.contains(e.target)){close();w.document.removeEventListener('click',dismiss)}}),0);
}
function openBenchKeyDialog(w,id){
 const b=app.state.bench,act=b.keyActions.find(a=>a.id===id),keys=act?[...act.keys]:[],hold=act?act.hold:1000;
 const d=w.document.createElement('div');d.className='modal-backdrop';
 d.innerHTML=`<div class="modal bench-action-modal"><div class="modal-header"><h2>${act?E(act.name||'编辑按键动作'):'新建按键动作'}</h2><button class="modal-close" data-close aria-label="关闭">×</button></div>
 <div class="bench-modal-section"><label class="modal-section-title">20 Key 组合</label><div class="key-grid key-editor-grid">${Array.from({length:20},(_,i)=>i+1).map(k=>`<button class="key-button ${keys.includes(k)?'pressed':''}" data-key="${k}">K${k}</button>`).join('')}</div>
 <div class="chosen-keys" id="bench-selected-keys"></div></div>
 <div class="bench-modal-section"><label class="modal-section-title" for="bench-action-hold">保持时间</label><div class="hold-input"><input type="number" id="bench-action-hold" min="0" max="600000" value="${E(hold)}"/><span>ms</span></div></div>
 <div class="modal-actions"><button class="small-btn" data-close>取消</button><button class="small-btn primary" data-save>保存</button></div></div>`;
 w.document.body.appendChild(d);
 let chosen=[...keys];const display=()=>{const mask=chosen.reduce((v,k)=>v|(1<<(k-1)),0);const selected=d.querySelector('#bench-selected-keys');selected.textContent=(chosen.length?chosen.map(k=>'K'+k).join(' + '):'无按键（纯等待）')+'   ·   0x'+mask.toString(16).toUpperCase().padStart(5,'0')};display();
 d.querySelectorAll('[data-key]').forEach(el=>el.onclick=()=>{const k=Number(el.dataset.key);chosen=chosen.includes(k)?chosen.filter(x=>x!==k):[...chosen,k].sort((a,b)=>a-b);el.classList.toggle('pressed');display()});
 d.querySelectorAll('[data-close]').forEach(el=>el.onclick=()=>d.remove());
 d.onclick=e=>{if(e.target===d)d.remove()};
 d.querySelector('[data-save]').onclick=()=>{const h=Number(d.querySelector('#bench-action-hold').value);if(!Number.isInteger(h)||h<0||h>600000){d.querySelector('#bench-action-hold').classList.add('invalid');return;}
  update(w,()=>{if(act){act.keys=[...chosen];act.hold=h;b.keys=[...chosen];b.hold=h;w._review.selectedKey=act.id;}
   else {const n={id:app.makeId(),name:chosen.length?'K'+chosen.join(' + K'):'纯等待',keys:[...chosen],hold:h};b.keyActions.push(n);b.keys=[...chosen];b.hold=h;w._review.selectedKey=n.id;}});d.remove();};
}
window.buildToolWindow=buildToolWindow;
})();
</script>
