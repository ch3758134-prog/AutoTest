<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>研发管理 · Project Control</title>
<link rel="stylesheet" href="/style.css">
<script src="/app.js" defer></script>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><div class="mark">P<span>.</span></div><div><strong>Project Control</strong><small>工程研发管理工作台</small></div></div>
    <div class="project-switch"><span class="tiny-label">当前项目</span><strong id="sideProject">加载中…</strong><small id="sideRelease"></small></div>
    <nav id="sidebarNav" aria-label="主导航">
      <div class="nav-label">项目管理</div>
      <button type="button" class="nav-item active" data-route="home"><span class="nav-icon">▦</span>项目总览</button>
      <button type="button" class="nav-item" data-route="delivery"><span class="nav-icon">◇</span>目标与交付</button>
      <button type="button" class="nav-item" data-route="work"><span class="nav-icon">☷</span>工作与计划</button>
      <button type="button" class="nav-item" data-route="process"><span class="nav-icon">⇄</span>研发流程</button>
      <div class="nav-label spaced">控制与协作</div>
      <button type="button" class="nav-item" data-route="decisions"><span class="nav-icon">◎</span>决策与问题</button>
      <button type="button" class="nav-item" data-route="collaboration"><span class="nav-icon">⌘</span>协作与证据</button>
    </nav>
    <div class="sidebar-bottom"><div class="side-disclaimer">GitHub 共享依据 · 人工触发 AI 协作</div><span>不是自动 Agent 系统</span></div>
  </aside>
  <div class="frame">
    <header class="topbar">
      <div class="breadcrumb" id="breadcrumbs">项目 / 总览</div>
      <div class="topbar-right"><span class="source-indicator" id="sourceIndicator">读取 Git 中</span><button id="exportButton" class="secondary-button" type="button">导出本地建议</button></div>
    </header>
    <main id="page" class="page" tabindex="-1"></main>
  </div>
</div>
<dialog id="drawer" class="drawer" aria-labelledby="drawerTitle">
  <div class="drawer-header"><div><span class="tiny-label" id="drawerKicker">工作详情</span><h2 id="drawerTitle">工作</h2></div><button type="button" class="close-button" id="drawerClose" aria-label="关闭">×</button></div>
  <div class="drawer-body" id="drawerContent"></div>
</dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
