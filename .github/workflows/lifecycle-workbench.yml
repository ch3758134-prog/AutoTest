name: Engineering Lifecycle Workbench

on:
  push:
    branches:
      - management/evolutionary-lifecycle-pilot-20261109
    paths:
      - 'tools/lifecycle/**'
      - '.github/workflows/lifecycle-workbench.yml'
  pull_request:
    paths:
      - 'tools/lifecycle/**'
      - '.github/workflows/lifecycle-workbench.yml'
  workflow_dispatch:

jobs:
  offline-tests:
    name: Python stdlib / business rules / localhost API
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python source
        run: python -m compileall -q tools/lifecycle
      - name: Run lifecycle tests
        run: python -m unittest discover -s tools/lifecycle/tests -v
      - name: Check research and studio browser script syntax
        run: |
          node --check tools/lifecycle/studio_research_ui.js
          node --check tools/lifecycle/studio_execution_ui.js
          node --check tools/lifecycle/studio_management_ui.js
          node --check tools/lifecycle/studio_capability_ui.js
          node --check tools/lifecycle/studio_change_ui.js
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          source = Path("tools/lifecycle/studio.html").read_text(encoding="utf-8")
          blocks = re.findall(r"<script>(.*?)</script>", source, flags=re.S)
          if len(blocks) != 1:
              raise SystemExit("Expected one inline studio JavaScript block")
          output = Path("/tmp/engineering-inline.js")
          output.write_text(blocks[0], encoding="utf-8")
          subprocess.run(["node", "--check", str(output)], check=True)
          PY
