name: R1 candidate Windows build and unit gates

on:
  push:
    branches:
      - feature/r1-usb-com-scan-preflight-20261122
      - 'ui/**'
  workflow_dispatch:

concurrency:
  group: r1-candidate-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-gates:
    name: Windows .NET 10 WPF build and regression tests
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v4
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.400'
      - name: Report candidate SHA and SDK
        shell: pwsh
        run: |
          git rev-parse HEAD
          dotnet --info
      - name: Restore entire Windows solution
        shell: pwsh
        run: dotnet restore HOST/AutoTest.sln
      - name: Debug WPF and backend build
        shell: pwsh
        run: dotnet build HOST/AutoTest.sln -c Debug --no-restore
      - name: Release WPF and backend build
        shell: pwsh
        run: dotnet build HOST/AutoTest.sln -c Release --no-restore
      - name: Debug regression tests with hang diagnosis
        shell: pwsh
        run: dotnet test HOST/AutoTest.sln -c Debug --no-build --no-restore --blame-hang-timeout 180s
      - name: Release regression tests with hang diagnosis
        shell: pwsh
        run: dotnet test HOST/AutoTest.sln -c Release --no-build --no-restore --blame-hang-timeout 180s
